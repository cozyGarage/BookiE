[package]
name = "bookie-tauri-grid-prototype"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
bookie-core = { path = "../../../crates/core" }
chrono = { version = "0.4", default-features = false }
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
serde_json = "1"
uuid = "1"
serde = { version = "1", features = ["derive"] }
tauri = "=2.12.5"

[build-dependencies]
tauri-build = "2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18"

[patch.crates-io]
glib = { path = "../../../vendor/glib" }
