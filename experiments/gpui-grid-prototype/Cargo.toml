[package]
name = "bookie-gpui-grid-prototype"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
serde_json = "1"
uuid = "1"
unicode-segmentation = "1"
gpui = "=0.2.2"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
