[package]
name = "tablepro-driver-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "drivers_sqlite"
path = "src/lib.rs"

[dependencies]
tablepro-core = { path = "../../core" }
libsqlite3-sys.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
rust_decimal.workspace = true
sqlx = { workspace = true, features = ["sqlite-unbundled"] }
sqlparser.workspace = true
tokio.workspace = true

[dev-dependencies]
tablepro-app-services = { path = "../../app-services" }
tablepro-policy = { path = "../../policy" }
serde_json.workspace = true
async-trait.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tokio-util.workspace = true
uuid.workspace = true

# The integration test includes the value contract by path; the shared exact-grid test also uses this crate.
[package.metadata.cargo-shear]
ignored = ["serde_json", "tablepro-app-services"]

[lints]
workspace = true
