[package]
name = "bookie-driver-mongodb"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "drivers_mongodb"
path = "src/lib.rs"

[dependencies]
bookie-core = { path = "../../core" }
async-trait.workspace = true
futures.workspace = true
mongodb = { version = "3.8", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
secrecy.workspace = true
serde_json.workspace = true
sqlparser.workspace = true
tokio.workspace = true

[dev-dependencies]
chrono.workspace = true
csv.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util.workspace = true
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["mongo"] }
zip = { version = "9.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true
