[package]
name = "tablepro-driver-mssql"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "drivers_mssql"
path = "src/lib.rs"

[features]
default = []
kerberos = ["tiberius/integrated-auth-gssapi"]

[dependencies]
tablepro-core = { path = "../../core" }
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
rust_decimal.workspace = true
secrecy.workspace = true
serde_json.workspace = true
tiberius.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["compat"] }

[dev-dependencies]
tablepro-app-services = { path = "../../app-services" }
secrecy.workspace = true
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["mssql_server"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
uuid.workspace = true

[lints]
workspace = true
