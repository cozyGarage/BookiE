[package]
name = "bookie-app-services"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "bookie_app_services"
path = "src/lib.rs"

[[bench]]
name = "workspace_save_io"
harness = false

[[bench]]
name = "sidebar_search"
harness = false

[dependencies]
aes-gcm.workspace = true
getrandom.workspace = true
bookie-core = { path = "../core" }
bookie-dump = { path = "../dump" }
bookie-policy = { path = "../policy" }
bookie-transport = { path = "../transport" }
bookie-storage = { path = "../storage" }
chrono.workspace = true
thiserror.workspace = true
serde.workspace = true
tracing.workspace = true
serde_json.workspace = true
secrecy.workspace = true
tempfile.workspace = true
rmp-serde.workspace = true
rust_decimal.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
bookie-driver-postgres = { path = "../drivers/postgres" }
bookie-driver-mysql = { path = "../drivers/mysql" }
bookie-driver-mssql = { path = "../drivers/mssql" }
bookie-driver-sqlite = { path = "../drivers/sqlite" }
bookie-ssh = { path = "../ssh" }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres", "mysql", "mssql_server"] }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
