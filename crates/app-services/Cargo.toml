[package]
name = "bookie-app-services"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "bookie_app_services"
path = "src/lib.rs"

[[bench]]
name = "workspace_save_io"
harness = false

[[bench]]
name = "sidebar_search"
harness = false

[dependencies]
bookie-core = { path = "../core" }
bookie-results = { path = "../results" }
bookie-dump = { path = "../dump" }
bookie-policy = { path = "../policy" }
bookie-transport = { path = "../transport" }
bookie-storage = { path = "../storage" }
bookie-ssh = { path = "../ssh" }
bookie-pg-sessions = { path = "../pg-sessions" }
bookie-checks = { path = "../checks" }
bookie-kafka-browser = { path = "../kafka-browser" }
chrono.workspace = true
gettext-rs = { version = "0.8", features = ["gettext-system"] }
thiserror.workspace = true
serde.workspace = true
tracing.workspace = true
serde_json.workspace = true
secrecy.workspace = true
tempfile.workspace = true
rust_decimal.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
sqlparser.workspace = true
unicode-width.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
async-trait.workspace = true
bookie-driver-postgres = { path = "../drivers/postgres" }
bookie-driver-mysql = { path = "../drivers/mysql" }
bookie-driver-mssql = { path = "../drivers/mssql" }
bookie-driver-sqlite = { path = "../drivers/sqlite" }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres", "mysql", "mssql_server"] }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
bookie-app-services = { path = ".", features = ["test-support"] }

[features]
# Constructors for frontends' tests: an isolated service with a temporary audit journal.
test-support = []

[lints]
workspace = true
