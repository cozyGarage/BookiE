[package]
name = "bookie-agentd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "bookie_agentd"
path = "src/lib.rs"

[[bin]]
name = "bookie-agentd"
path = "src/main.rs"

[features]
default = ["kerberos"]
kerberos = ["bookie-driver-mssql/kerberos"]

[dependencies]
bookie-core = { path = "../core" }
bookie-policy = { path = "../policy" }
bookie-ssh = { path = "../ssh" }
bookie-storage = { path = "../storage" }
bookie-transport = { path = "../transport" }
bookie-mcp = { path = "../mcp" }
bookie-driver-registry = { path = "../registry" }
bookie-driver-mssql = { path = "../drivers/mssql" }
bookie-driver-sqlite = { path = "../drivers/sqlite" }
async-trait.workspace = true
chrono.workspace = true
libc.workspace = true
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
bookie-driver-postgres = { path = "../drivers/postgres" }
tempfile.workspace = true
bookie-release-tests = { path = "../../tests/release" }

# Kept so the `kerberos` feature can enable `bookie-driver-mssql/kerberos`; no source file names the crate.
[package.metadata.cargo-shear]
ignored = ["drivers_mssql"]

[lints]
workspace = true
