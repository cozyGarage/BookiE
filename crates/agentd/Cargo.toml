[package]
name = "bookie-agentd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "bookie_agentd"
path = "src/lib.rs"

[[bin]]
name = "bookie-agentd"
path = "src/main.rs"

[features]
default = ["kerberos"]
kerberos = ["bookie-driver-mssql/kerberos"]
duckdb = ["dep:bookie-driver-duckdb"]

[dependencies]
bookie-core = { path = "../core" }
bookie-policy = { path = "../policy" }
bookie-ssh = { path = "../ssh" }
bookie-storage = { path = "../storage" }
bookie-transport = { path = "../transport" }
bookie-mcp = { path = "../mcp" }
bookie-driver-clickhouse = { path = "../drivers/clickhouse" }
bookie-driver-duckdb = { path = "../drivers/duckdb", optional = true }
bookie-driver-mongodb = { path = "../drivers/mongodb" }
bookie-driver-mssql = { path = "../drivers/mssql" }
bookie-driver-mysql = { path = "../drivers/mysql" }
bookie-driver-postgres = { path = "../drivers/postgres" }
bookie-driver-redis = { path = "../drivers/redis" }
bookie-driver-sqlite = { path = "../drivers/sqlite" }
async-trait.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
bookie-release-tests = { path = "../../tests/release" }

[lints]
workspace = true
