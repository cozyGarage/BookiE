[package]
name = "bookie-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "bookie_policy"
path = "src/lib.rs"

[dependencies]
bookie-core = { path = "../core" }
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
glob.workspace = true
hex.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
sqlparser = { workspace = true, features = ["visitor"] }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-util.workspace = true
tempfile.workspace = true
proptest = "1"
secrecy.workspace = true
bookie-driver-postgres = { path = "../drivers/postgres" }
bookie-driver-mssql = { path = "../drivers/mssql" }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["mssql_server", "postgres"] }

[lints]
workspace = true
