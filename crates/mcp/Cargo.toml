[package]
name = "bookie-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "bookie_mcp"
path = "src/lib.rs"

[dependencies]
bookie-core = { path = "../core" }
bookie-policy = { path = "../policy" }
bookie-storage = { path = "../storage" }
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "io-std"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
libc.workspace = true
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"], optional = true }

[features]
rmcp-prototype = ["dep:rmcp"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile.workspace = true
bookie-driver-mongodb = { path = "../drivers/mongodb" }
bookie-driver-postgres = { path = "../drivers/postgres" }
bookie-driver-mysql = { path = "../drivers/mysql" }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["mongo", "postgres", "mysql"] }
mongodb = { version = "3.8", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
secrecy.workspace = true

[lints]
workspace = true
