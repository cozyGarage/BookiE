name: nightly
on:
  workflow_dispatch:
    inputs:
      full:
        description: Run every driver and every mutation shard instead of tonight's rotation
        type: boolean
        default: false
      plan_only:
        description: Run only the plan job and print the plan to its log
        type: boolean
        default: false

concurrency:
  group: nightly-${{ github.ref }}-${{ inputs.plan_only && 'plan' || 'run' }}
  cancel-in-progress: true

defaults:
  run:
    shell: /usr/local/libexec/bookie-ci-cache run {0}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  GITHUB_STEP_SUMMARY: /dev/null
  PATH: /opt/cargo/bin:/home/runner/.cargo/bin:/home/ubuntu/.cargo/bin:/usr/local/bin:/usr/bin:/bin
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: /var/cache/ci/sccache
  SCCACHE_CACHE_SIZE: 40G

jobs:
  plan:
    runs-on: any-host
    timeout-minutes: 15
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      reason: ${{ steps.plan.outputs.reason }}
      drivers: ${{ steps.plan.outputs.drivers }}
      mutation: ${{ steps.plan.outputs.mutation }}
      values: ${{ steps.plan.outputs.values }}
      gtk_soak: ${{ steps.plan.outputs.gtk_soak }}
      arch_package: ${{ steps.plan.outputs.arch_package }}
    steps:
      - name: Prepare runner workspace
        run: |
          rm -rf src
      - name: Check runner space before checkout
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        run: true
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: src
      - name: Plan the shards for today
        id: plan
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          FULL_RUN: ${{ inputs.full }}
          PLAN_ONLY: ${{ inputs.plan_only }}
        run: |
          cd src
          args=(--commit "${{ github.sha }}" --lookup --changed-from-git --github-output "$GITHUB_OUTPUT")
          if [ "$FULL_RUN" = true ]; then args+=(--force); fi
          if [ "$PLAN_ONLY" = true ]; then args+=(--plan-only); fi
          python3 scripts/ci-nightly-plan.py "${args[@]}"
      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  coverage:
    runs-on: any-host
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' }}
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/nightly-coverage
      RUSTC_WRAPPER: ""
    steps:
      - name: Prepare runner workspace
        run: |
          rm -rf src
      - name: Check runner space before checkout
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        run: true
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Coverage tools
        run: |
          rustup component add llvm-tools-preview
          command -v cargo-llvm-cov >/dev/null || cargo install --locked cargo-llvm-cov
      - name: Line coverage of the unit tier
        run: |
          cd src
          cargo llvm-cov --workspace --lib --bins --json --summary-only --output-path "$GITHUB_WORKSPACE/coverage.json"
          python3 scripts/check-coverage-floor.py "$GITHUB_WORKSPACE/coverage.json"

      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  docker-coverage:
    runs-on: any-host
    needs: [plan, coverage]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' && needs.plan.outputs.drivers != '[]' }}
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/nightly-docker-cov-${{ matrix.driver }}
      RUSTC_WRAPPER: ""
      BOOKIE_TEST_RUN_ID: nightly-${{ github.run_id }}-${{ matrix.driver }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        driver: ${{ fromJSON(needs.plan.outputs.drivers) }}
    steps:
      - name: Prepare runner workspace
        run: |
          rm -rf src
      - name: Check runner space before checkout
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        run: true
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Reconcile abandoned test fixtures
        run: cd src && python3 scripts/cleanup-stale-ci-fixtures.py
      - name: Docker Hub login
        run: bash src/scripts/docker-hub-login.sh
      - name: Coverage tools
        run: |
          rustup component add llvm-tools-preview
          command -v cargo-llvm-cov >/dev/null || cargo install --locked cargo-llvm-cov
      - name: Line coverage with the Docker suite, against the crate floor
        run: |
          cd src
          cleanup_testcontainers() {
            python3 scripts/cleanup-testcontainers.py "$BOOKIE_TEST_RUN_ID"
          }
          trap cleanup_testcontainers EXIT
          targets=(--lib --tests)
          [ "${{ matrix.driver }}" = postgres ] && targets=(--lib --test integration)
          cargo llvm-cov --no-report --locked -p "bookie-driver-${{ matrix.driver }}" "${targets[@]}" -- --include-ignored --test-threads=1
          cargo llvm-cov report --json --summary-only --output-path "$GITHUB_WORKSPACE/coverage-${{ matrix.driver }}.json"
          python3 scripts/check-crate-coverage-floors.py "$GITHUB_WORKSPACE/coverage-${{ matrix.driver }}.json" --only "crates/drivers/${{ matrix.driver }}"

      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  mutation:
    runs-on: any-host
    needs: [plan, docker-coverage]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' && needs.plan.outputs.mutation != '[]' }}
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/nightly-mutants-${{ matrix.label }}
      RUSTC_WRAPPER: ""
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.mutation) }}
    steps:
      - name: Prepare runner workspace
        run: |
          rm -rf src
      - name: Check runner space before checkout
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        run: true
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Mutation tool
        run: |
          command -v cargo-mutants >/dev/null || cargo install --locked cargo-mutants --version ^27
      - name: Mutants that no test notices
        env:
          MUTANT_FILES: ${{ matrix.files }}
        run: |
          cd src
          args=(--package "${{ matrix.package }}" --test-tool cargo --shard "${{ matrix.shard }}"
                --output "$GITHUB_WORKSPACE/mutants-${{ matrix.label }}" --timeout 60 --build-timeout 900 --no-shuffle)
          for file in $MUTANT_FILES; do args+=(--file "$file"); done
          status=0
          test_args=(--lib)
          [ "${{ matrix.package }}" = bookie-agentd ] && test_args+=(--bins --tests)
          cargo mutants "${args[@]}" -- "${test_args[@]}" || status=$?
          partial=()
          if [ "${{ matrix.partial }}" = true ]; then partial=(--partial); fi
          python3 scripts/check-mutants-baseline.py "${{ matrix.package }}" "$GITHUB_WORKSPACE/mutants-${{ matrix.label }}" "$status" "${partial[@]}"

      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  gtk-soak:
    runs-on: any-host
    needs: [plan, mutation]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' && needs.plan.outputs.gtk_soak != '[]' }}
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/nightly-soak
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.gtk_soak) }}
    steps:
      - name: Prepare runner workspace
        run: |
          rm -rf src
      - name: Check runner space before checkout
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        run: true
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Select isolated MCP HTTP port
        run: cd src && python3 scripts/ci-mcp-port.py "${{ matrix.run }}"
      - name: Five retry-free installed GTK attempts
        run: |
          cd src
          cargo build --release --locked -p bookie-app --bin bookie-app
          binary="$PWD/target-soak-${{ matrix.run }}/usr/bin/bookie"
          install -Dm755 "$CARGO_TARGET_DIR/release/bookie-app" "$binary"
          for attempt in 1 2 3 4 5; do
            echo "soak run ${{ matrix.run }} attempt $attempt at $(git rev-parse HEAD)"
            BOOKIE_GTK_BINARY="$binary" bash scripts/test-gtk-safety.sh >"$GITHUB_WORKSPACE/soak-${{ matrix.run }}-$attempt.log" 2>&1 || {
              grep -aE "^passed:|^FAILED|scenario.s. failed|AssertionError" "$GITHUB_WORKSPACE/soak-${{ matrix.run }}-$attempt.log" | tail -20
              exit 1
            }
          done

      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  arch-package:
    runs-on: any-host
    needs: [plan, mutation]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' && needs.plan.outputs.arch_package == 'true' }}
    timeout-minutes: 60
    steps:
      - name: Prepare runner workspace
        run: |
          rm -rf src
      - name: Check runner space before checkout
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        run: true
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Build the Arch package in a container and upgrade from the released one
        run: |
          cd src && bash scripts/test-arch-package-container.sh
      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  values:
    runs-on: any-host
    needs: [plan, mutation]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' && needs.plan.outputs.values == 'true' }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/nightly-values
    steps:
      - name: Prepare runner workspace
        run: |
          rm -rf src
      - name: Check runner space before checkout
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        run: true
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Shared value contracts across drivers, GTK and DuckDB
        run: |
          cd src && python3 scripts/run-test-layer.py values
      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
