name: lab-ci

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - ".github/workflows/build-linux.yml"
      - ".github/actions/dockerhub-login/**"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - ".github/workflows/build-linux.yml"
      - ".github/actions/dockerhub-login/**"
  schedule:
    - cron: "13 14 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Commit SHA, tag or branch to build. Pin a release candidate so
          every job in the run tests the same tree.
        required: false
        default: ""
        type: string

concurrency:
  group: build-linux-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref || 'auto' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: /usr/local/libexec/bookie-ci-cache run {0}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  BOOKIE_BUNDLE_CACHE: /var/cache/ci/bundles
  BOOKIE_GTK_WAIT_SECONDS: "45"
  BOOKIE_GTK_SCENARIO_RETRIES: "1"
  GITHUB_STEP_SUMMARY: /dev/null
  PATH: /opt/cargo/bin:/home/runner/.cargo/bin:/home/ubuntu/.cargo/bin:/usr/local/bin:/usr/bin:/bin
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: /var/cache/ci/sccache
  SCCACHE_CACHE_SIZE: 40G
  CARGO_TARGET_DIR: /var/cache/ci/target/${{ github.job }}
  TMPDIR: /var/cache/ci/target

jobs:
  pin-revision:
    name: Pin tested revision
    runs-on: any-host
    outputs:
      revision: ${{ steps.pin.outputs.revision }}
    timeout-minutes: 5
    steps:
      - name: Prepare runner workspace
        run: |
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR"
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: src
      - name: Record the source revision
        id: pin
        shell: bash
        env:
          CI_REQUESTED_REF: ${{ inputs.ref }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: cd src && python3 scripts/check-ci-revision.py
      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src
          fi

  guards:
    needs: [pin-revision]
    runs-on: any-host
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BOOKIE_TOOL_DIR: /var/cache/ci/tools
      CARGO_TARGET_DIR: /var/cache/ci/target/bookie-guards-${{ github.run_id }}
      TMPDIR: /var/cache/ci/tmp/bookie-guards-${{ github.run_id }}
      RUSTC_WRAPPER: ""
    steps:
      - name: Prepare runner workspace
        run: |
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR"
          rm -rf src
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Script harness and guards
        run: |
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR"
          cd src
          cargo fetch --locked --manifest-path apps/linux/app/Cargo.toml
          bash scripts/test-harness.sh
          bash scripts/check-file-size.sh
          bash scripts/check-bounded-operations.sh
          bash scripts/check-panic-sites.sh
          python3 scripts/check-function-size.py
          python3 scripts/check-comment-lines.py
          cargo fmt --all -- --check
      - name: Clean pilot scratch
        if: always()
        run: rm -rf -- "$CARGO_TARGET_DIR" "$TMPDIR"

      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  gpui-tests:
    runs-on: any-host
    needs: [pin-revision, test-build]
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 4
      RUSTC_WRAPPER: ""
    steps:
      - name: Prepare runner workspace
        run: |
          rm -rf src
      - name: Check runner space before checkout
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        run: true
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Obtain the source-pinned GPUI test bundle
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_GITHUB_ARTIFACT_TOKEN: ${{ secrets.BOOKIE_GITHUB_ARTIFACT_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: bash src/scripts/prepare-test-bundle.sh "${{ needs.pin-revision.outputs.revision }}" gpui
      - name: GPUI model and simulated interaction tests
        run: |
          cd src
          workspace_root="$(cd apps/gpui && pwd -P)"
          test -r "$workspace_root/tests/fixtures/orders.sqlite"
          mkdir -p "$TMPDIR/bookie-gpui-${GITHUB_RUN_ID}"
          NEXTEST="$(bash scripts/ensure-nextest.sh)"
          "$NEXTEST" nextest run --archive-file "$BOOKIE_TEST_BUNDLE/nextest.tar.zst" \
            --workspace-remap "$workspace_root" \
            --extract-to "$TMPDIR/bookie-gpui-${GITHUB_RUN_ID}" --profile default --no-tests=fail
      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          rm -rf -- "$TMPDIR/bookie-gpui-${GITHUB_RUN_ID}"
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src
          fi
  gtk-build:
    runs-on: build-host
    needs: [pin-revision, guards]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: /cargo
      SCCACHE_DIR: /cargo/sccache
      RUSTC_WRAPPER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      CMAKE_C_COMPILER_LAUNCHER: /tools/sccache
      CMAKE_CXX_COMPILER_LAUNCHER: /tools/sccache
      SCCACHE_BASEDIRS: /target/bookie-${{ github.job }}
      SCCACHE_SERVER_UDS: /target/tmp-${{ github.run_id }}-${{ github.job }}/sccache.sock
      PATH: /tools:/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
      CARGO_TARGET_DIR: /target/bookie-${{ github.job }}
      TMPDIR: /target/tmp-${{ github.run_id }}-${{ github.job }}
      BOOKIE_TOOL_DIR: /tools
      CARGO_PROFILE_CI_STRIP: symbols
    steps:
      - name: Prepare runner workspace
        run: |
          mkdir -p "$CARGO_TARGET_DIR" "$TMPDIR"
          touch "$CARGO_TARGET_DIR/.bookie-last-used" /target/.bookie-build-cache.lock
          sccache --start-server
          rm -rf src
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Prepare artifact runtime
        run: bash src/scripts/ensure-node.sh >> "$GITHUB_PATH"
      - name: Build the shared GTK binary
        env:
          CARGO_BUILD_JOBS: "8"
        run: |
          exec 9>>/target/.bookie-build-cache.lock
          flock --exclusive 9
          cd src
          cargo build --profile ci --locked -p bookie-app --bin bookie-app
          python3 scripts/ci-gtk-artifact.py create "$CARGO_TARGET_DIR/ci/bookie-app" "$GITHUB_WORKSPACE/gtk-artifact" "${{ needs.pin-revision.outputs.revision }}"
      - name: Upload the source-pinned GTK binary
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: gtk-ci-${{ github.run_id }}-${{ needs.pin-revision.outputs.revision }}
          path: gtk-artifact/
          if-no-files-found: error
          retention-days: 2
      - name: Clean builder scratch
        if: always()
        run: |
          if [[ -S "$SCCACHE_SERVER_UDS" ]]; then
            sccache --show-stats
            sccache --stop-server
          fi
          rm -rf -- "$TMPDIR"
          if [[ -f src/scripts/ci-cache.py ]]; then
            python3 src/scripts/ci-cache.py --root /target --lock /target/.bookie-build-cache.lock cleanup --min-free-gib 30
          fi


      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  clippy:
    needs: [pin-revision]
    runs-on: build-host
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: /cargo
      BOOKIE_TOOL_DIR: /tools
      SCCACHE_DIR: /cargo/sccache
      RUSTC_WRAPPER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      CMAKE_C_COMPILER_LAUNCHER: /tools/sccache
      CMAKE_CXX_COMPILER_LAUNCHER: /tools/sccache
      SCCACHE_BASEDIRS: /target/bookie-${{ github.job }}
      SCCACHE_SERVER_UDS: /target/tmp-${{ github.run_id }}-${{ github.job }}/sccache.sock
      PATH: /tools:/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
      CARGO_TARGET_DIR: /target/bookie-${{ github.job }}
      TMPDIR: /target/tmp-${{ github.run_id }}-${{ github.job }}
    steps:
      - name: Prepare runner workspace
        run: |
          mkdir -p "$CARGO_TARGET_DIR" "$TMPDIR"
          touch "$CARGO_TARGET_DIR/.bookie-last-used" /target/.bookie-build-cache.lock
          sccache --start-server
          rm -rf src
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Clippy
        run: |
          exec 9>>/target/.bookie-build-cache.lock
          flock --exclusive 9
          cd src && cargo clippy --workspace --all-targets -- -D warnings
      - name: Clean builder scratch
        if: always()
        run: |
          if [[ -S "$SCCACHE_SERVER_UDS" ]]; then
            sccache --show-stats
            sccache --stop-server
          fi
          rm -rf -- "$TMPDIR"
          if [[ -f src/scripts/ci-cache.py ]]; then
            python3 src/scripts/ci-cache.py --root /target --lock /target/.bookie-build-cache.lock cleanup --min-free-gib 30
          fi


      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  test-build:
    runs-on: build-host
    needs: [pin-revision, guards, clippy]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: /target/bookie-${{ github.job }}
      TMPDIR: /target/tmp-${{ github.run_id }}-${{ github.job }}
      CARGO_HOME: /cargo
      BOOKIE_TOOL_DIR: /tools
      CARGO_BUILD_JOBS: "8"
      SCCACHE_DIR: /cargo/sccache
      RUSTC_WRAPPER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      CMAKE_C_COMPILER_LAUNCHER: /tools/sccache
      CMAKE_CXX_COMPILER_LAUNCHER: /tools/sccache
      SCCACHE_BASEDIRS: /target/bookie-${{ github.job }}
      SCCACHE_SERVER_UDS: /target/tmp-${{ github.run_id }}-${{ github.job }}/sccache.sock
      PATH: /tools:/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
      BOOKIE_BUILD_IMAGE: sha256:f21a3d99fb08a940f7fbf775ad6878d52a3fc957876970ae7d0f607b89696ec4
    steps:
      - name: Prepare runner workspace
        run: |
          mkdir -p "$CARGO_TARGET_DIR" "$TMPDIR"
          touch "$CARGO_TARGET_DIR/.bookie-last-used" /target/.bookie-build-cache.lock
          sccache --start-server
          rm -rf src
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Install the GPUI linker dependency
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends libxkbcommon-x11-dev
      - name: Build the default test bundle
        run: |
          exec 9>>/target/.bookie-build-cache.lock
          flock --exclusive 9
          cd src && bash scripts/build-test-bundles.sh "$GITHUB_WORKSPACE/test-bundles" forgejo
      - name: Publish source-pinned test bundles
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: |
          cd src
          mapfile -t publish_groups < <(python3 -c 'import json; print(*json.load(open("scripts/ci-test-bundle-groups.json"))["providers"]["forgejo"], sep="\n")')
          publish_groups+=(unit sandbox gpui)
          for group in "${publish_groups[@]}"; do
            python3 scripts/ci-bundle-registry.py publish "$GITHUB_WORKSPACE/test-bundles/$group" "${{ needs.pin-revision.outputs.revision }}" "$group"
          done
      - name: Remove expired test bundles
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_REGISTRY_API_URL: ${{ github.server_url }}/api/v1/packages/trung
        run: |
          cd src
          python3 scripts/ci-bundle-registry.py prune "${{ needs.pin-revision.outputs.revision }}" --retention-days 14
      - name: Check the no-default-features layer
        run: |
          exec 9>>/target/.bookie-build-cache.lock
          flock --exclusive 9
          cd src && python3 scripts/run-test-layer.py no-default-features
      - name: Clean builder scratch
        if: always()
        run: |
          if [[ -S "$SCCACHE_SERVER_UDS" ]]; then
            sccache --show-stats
            sccache --stop-server
          fi
          rm -rf -- "$TMPDIR"
          if [[ -f src/scripts/ci-cache.py ]]; then
            python3 src/scripts/ci-cache.py --root /target --lock /target/.bookie-build-cache.lock cleanup --min-free-gib 30
          fi


      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  unit:
    runs-on: any-host
    needs: [pin-revision, test-build]
    timeout-minutes: 90
    steps:
      - name: Prepare runner workspace
        run: |
          rm -rf src
      - name: Check runner space before checkout
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        run: true
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: src
      - name: Obtain the source-pinned test bundle
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_GITHUB_ARTIFACT_TOKEN: ${{ secrets.BOOKIE_GITHUB_ARTIFACT_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: bash src/scripts/prepare-test-bundle.sh "${{ needs.pin-revision.outputs.revision }}" unit
      - name: Unit tests
        env:
          BOOKIE_TOOL_DIR: /var/cache/ci/tools
        run: |
          cd src
          NEXTEST="$(bash scripts/ensure-nextest.sh)"
          mkdir -p "$CARGO_TARGET_DIR"
          export TMPDIR="$CARGO_TARGET_DIR"
          "$NEXTEST" nextest run --archive-file "$BOOKIE_TEST_BUNDLE/nextest.tar.zst" --workspace-remap "$PWD" --profile ci --no-tests=fail -E 'kind(lib) | kind(bin)'
      - name: Focused Data-lane change contracts
        env:
          BOOKIE_CI_REF: ${{ github.ref }}
          BOOKIE_CI_EVENT_NAME: ${{ github.event_name }}
          BOOKIE_CI_EVENT_BEFORE: ${{ github.event.before || 'HEAD^' }}
        run: |
          cd src
          if [[ "$BOOKIE_CI_REF" == "refs/heads/main" || "$BOOKIE_CI_EVENT_NAME" != "push" ]]; then
            export BOOKIE_CHANGE_BASE="$BOOKIE_CI_EVENT_BEFORE"
          else
            export BOOKIE_CHANGE_BASE="$(git merge-base HEAD origin/main)"
          fi
          python3 scripts/run-test-layer.py change-contracts

      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  sandbox:
    runs-on: any-host
    needs: [pin-revision, test-build]
    timeout-minutes: 90
    steps:
      - name: Prepare runner workspace
        run: |
          rm -rf src
      - name: Check runner space before checkout
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        run: true
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Obtain the source-pinned test bundle
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_GITHUB_ARTIFACT_TOKEN: ${{ secrets.BOOKIE_GITHUB_ARTIFACT_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: bash src/scripts/prepare-test-bundle.sh "${{ needs.pin-revision.outputs.revision }}" sandbox
      - name: Sandbox tier
        env:
          BOOKIE_TOOL_DIR: /var/cache/ci/tools
          BOOKIE_NEXTEST_PROFILE: ci
        run: |
          cd src && python3 scripts/run-test-layer.py sandbox

      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  widgets:
    runs-on: any-host
    needs: [pin-revision, test-build]
    timeout-minutes: 90
    steps:
      - name: Prepare runner workspace
        run: |
          rm -rf src
      - name: Check runner space before checkout
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        run: true
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Obtain the source-pinned test bundle
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_GITHUB_ARTIFACT_TOKEN: ${{ secrets.BOOKIE_GITHUB_ARTIFACT_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: bash src/scripts/prepare-test-bundle.sh "${{ needs.pin-revision.outputs.revision }}" direct
      - name: GTK widget tests
        run: cd src && python3 scripts/run-test-layer.py widgets

      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  floor-build:
    runs-on: build-host
    needs: [pin-revision, guards, clippy]
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: /target/bookie-${{ github.job }}
      TMPDIR: /target/tmp-${{ github.run_id }}-${{ github.job }}
      CARGO_HOME: /cargo
      BOOKIE_TOOL_DIR: /tools
      CARGO_BUILD_JOBS: "8"
      SCCACHE_DIR: /cargo/sccache
      RUSTC_WRAPPER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      CMAKE_C_COMPILER_LAUNCHER: /tools/sccache
      CMAKE_CXX_COMPILER_LAUNCHER: /tools/sccache
      SCCACHE_BASEDIRS: /target/bookie-${{ github.job }}
      SCCACHE_SERVER_UDS: /target/tmp-${{ github.run_id }}-${{ github.job }}/sccache.sock
      PATH: /tools:/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
    steps:
      - name: Prepare runner workspace
        run: |
          mkdir -p "$CARGO_TARGET_DIR" "$TMPDIR"
          touch "$CARGO_TARGET_DIR/.bookie-last-used" /target/.bookie-build-cache.lock
          sccache --start-server
          rm -rf src
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Install package validation tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends desktop-file-utils
      - name: Build the shared release package
        run: |
          exec 9>>/target/.bookie-build-cache.lock
          flock --exclusive 9
          cd src
          DEB_OUT="$GITHUB_WORKSPACE/floor-package" bash scripts/build-deb.sh
          package=$(find "$GITHUB_WORKSPACE/floor-package" -maxdepth 1 -name '*.deb' -print -quit)
