  supply-chain:
    runs-on: build-host
    needs: [pin-revision, guards, clippy]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: /cargo
      RUSTC_WRAPPER: ""
      PATH: /opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
      CARGO_TARGET_DIR: /target/${{ github.run_id }}/${{ github.job }}
      TMPDIR: /target/${{ github.run_id }}/${{ github.job }}
    steps:
      - name: Prepare runner workspace
        run: |
          mkdir -p "$CARGO_TARGET_DIR" "$TMPDIR"
          rm -rf src
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Supply-chain tools
        run: |
          command -v cargo-deny >/dev/null || cargo install --locked cargo-deny --version 0.20.2
          command -v cargo-audit >/dev/null || cargo install --locked cargo-audit --version 0.22.2
      - name: Advisories, licenses and sources
        run: |
          cd src && python3 scripts/run-test-layer.py supply-chain
      - name: Vendored crates equal upstream plus their patches
        run: |
          cd src && python3 scripts/vendor-patches.py check
      - name: Clean builder scratch
        if: always()
        run: rm -rf -- "$CARGO_TARGET_DIR" "$TMPDIR"

      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  regression-gate:
    name: Forgejo regression gate
    if: always() && !cancelled()
    needs:
      - pin-revision
      - guards
      - gpui-tests
      - gtk-build
      - clippy
      - test-build
      - b4-rollback
      - unit
      - sandbox
      - widgets
      - floor-build
      - distro-floor-scenarios
      - driver
      - e2e
      - security-policy
      - consumers
      - gtk
      - pg-release
      - socket-ssh
      - gtk-server
      - driver-tls
      - keyring
      - supply-chain
    runs-on: any-host
    timeout-minutes: 5
    steps:
      - name: Check runner space before checkout
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        run: true
      - name: Check out source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: src
      - name: Evaluate finalized job results
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 src/scripts/check-forgejo-ci-jobs.py
      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src
          fi
