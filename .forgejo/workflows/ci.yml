name: lab-ci

on:
  push:
    branches: ["**"]
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: bookie-ci-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: /usr/local/libexec/bookie-ci-cache run {0}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  BOOKIE_BUNDLE_CACHE: /var/cache/ci/bundles
  BOOKIE_GTK_WAIT_SECONDS: "45"
  BOOKIE_GTK_SCENARIO_RETRIES: "1"
  GITHUB_STEP_SUMMARY: /dev/null
  PATH: /opt/cargo/bin:/home/runner/.cargo/bin:/home/ubuntu/.cargo/bin:/usr/local/bin:/usr/bin:/bin
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: /var/cache/ci/sccache
  SCCACHE_CACHE_SIZE: 40G
  CARGO_TARGET_DIR: /var/cache/ci/target/${{ github.job }}
  TMPDIR: /var/cache/ci/target

jobs:
  guards:
    runs-on: any-host
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BOOKIE_TOOL_DIR: /var/cache/ci/tools
      CARGO_TARGET_DIR: /var/cache/ci/target/bookie-guards-${{ github.run_id }}
      TMPDIR: /var/cache/ci/tmp/bookie-guards-${{ github.run_id }}
      RUSTC_WRAPPER: ""
    steps:
      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR"
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Script harness and guards
        run: |
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR"
          cd src
          cargo fetch --locked --manifest-path apps/linux/app/Cargo.toml
          bash scripts/test-harness.sh
          bash scripts/check-file-size.sh
          bash scripts/check-bounded-operations.sh
          bash scripts/check-panic-sites.sh
          python3 scripts/check-function-size.py
          python3 scripts/check-comment-lines.py
          cargo fmt --all -- --check
      - name: Clean pilot scratch
        if: always()
        run: rm -rf -- "$CARGO_TARGET_DIR" "$TMPDIR"

      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  gtk-build:
    runs-on: build-host
    needs: [guards]
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: /cargo
      SCCACHE_DIR: /cargo/sccache
      RUSTC_WRAPPER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      CMAKE_C_COMPILER_LAUNCHER: /tools/sccache
      CMAKE_CXX_COMPILER_LAUNCHER: /tools/sccache
      SCCACHE_BASEDIRS: /target/bookie-${{ github.job }}
      SCCACHE_SERVER_UDS: /target/tmp-${{ github.run_id }}-${{ github.job }}/sccache.sock
      PATH: /tools:/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
      CARGO_TARGET_DIR: /target/bookie-${{ github.job }}
      TMPDIR: /target/tmp-${{ github.run_id }}-${{ github.job }}
      BOOKIE_TOOL_DIR: /tools
      CARGO_PROFILE_CI_STRIP: symbols
    steps:
      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          mkdir -p "$CARGO_TARGET_DIR" "$TMPDIR"
          touch "$CARGO_TARGET_DIR/.bookie-last-used" /target/.bookie-build-cache.lock
          sccache --start-server
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Prepare artifact runtime
        run: bash src/scripts/ensure-node.sh >> "$GITHUB_PATH"
      - name: Build the shared GTK binary
        env:
          CARGO_BUILD_JOBS: "8"
        run: |
          exec 9>>/target/.bookie-build-cache.lock
          flock --exclusive 9
          cd src
          cargo build --profile ci --locked -p bookie-app --bin bookie-app
          python3 scripts/ci-gtk-artifact.py create "$CARGO_TARGET_DIR/ci/bookie-app" "$GITHUB_WORKSPACE/gtk-artifact" "${{ github.sha }}"
      - name: Upload the source-pinned GTK binary
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: gtk-ci-${{ github.run_id }}-${{ github.sha }}
          path: gtk-artifact/
          if-no-files-found: error
          retention-days: 2
      - name: Clean builder scratch
        if: always()
        run: |
          if [[ -S "$SCCACHE_SERVER_UDS" ]]; then
            sccache --show-stats
            sccache --stop-server
          fi
          rm -rf -- "$TMPDIR"
          if [[ -f src/scripts/ci-cache.py ]]; then
            python3 src/scripts/ci-cache.py --root /target --lock /target/.bookie-build-cache.lock cleanup --min-free-gib 30
          fi


      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  clippy:
    runs-on: build-host
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: /cargo
      BOOKIE_TOOL_DIR: /tools
      SCCACHE_DIR: /cargo/sccache
      RUSTC_WRAPPER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      CMAKE_C_COMPILER_LAUNCHER: /tools/sccache
      CMAKE_CXX_COMPILER_LAUNCHER: /tools/sccache
      SCCACHE_BASEDIRS: /target/bookie-${{ github.job }}
      SCCACHE_SERVER_UDS: /target/tmp-${{ github.run_id }}-${{ github.job }}/sccache.sock
      PATH: /tools:/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
      CARGO_TARGET_DIR: /target/bookie-${{ github.job }}
      TMPDIR: /target/tmp-${{ github.run_id }}-${{ github.job }}
    steps:
      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          mkdir -p "$CARGO_TARGET_DIR" "$TMPDIR"
          touch "$CARGO_TARGET_DIR/.bookie-last-used" /target/.bookie-build-cache.lock
          sccache --start-server
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Clippy
        run: |
          exec 9>>/target/.bookie-build-cache.lock
          flock --exclusive 9
          cd src && cargo clippy --workspace --all-targets -- -D warnings
      - name: Clean builder scratch
        if: always()
        run: |
          if [[ -S "$SCCACHE_SERVER_UDS" ]]; then
            sccache --show-stats
            sccache --stop-server
          fi
          rm -rf -- "$TMPDIR"
          if [[ -f src/scripts/ci-cache.py ]]; then
            python3 src/scripts/ci-cache.py --root /target --lock /target/.bookie-build-cache.lock cleanup --min-free-gib 30
          fi


      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  test-build:
    runs-on: build-host
    needs: [guards, clippy]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: /target/bookie-${{ github.job }}
      TMPDIR: /target/tmp-${{ github.run_id }}-${{ github.job }}
      CARGO_HOME: /cargo
      BOOKIE_TOOL_DIR: /tools
      CARGO_BUILD_JOBS: "8"
      SCCACHE_DIR: /cargo/sccache
      RUSTC_WRAPPER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      CMAKE_C_COMPILER_LAUNCHER: /tools/sccache
      CMAKE_CXX_COMPILER_LAUNCHER: /tools/sccache
      SCCACHE_BASEDIRS: /target/bookie-${{ github.job }}
      SCCACHE_SERVER_UDS: /target/tmp-${{ github.run_id }}-${{ github.job }}/sccache.sock
      PATH: /tools:/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
      BOOKIE_BUILD_IMAGE: sha256:f21a3d99fb08a940f7fbf775ad6878d52a3fc957876970ae7d0f607b89696ec4
    steps:
      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          mkdir -p "$CARGO_TARGET_DIR" "$TMPDIR"
          touch "$CARGO_TARGET_DIR/.bookie-last-used" /target/.bookie-build-cache.lock
          sccache --start-server
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Build the default test bundle
        run: |
          exec 9>>/target/.bookie-build-cache.lock
          flock --exclusive 9
          cd src && bash scripts/build-test-bundles.sh "$GITHUB_WORKSPACE/test-bundles" default
      - name: Publish the default test bundle
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_GITHUB_ARTIFACT_TOKEN: ${{ secrets.BOOKIE_GITHUB_ARTIFACT_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: cd src && python3 scripts/ci-bundle-registry.py publish "$GITHUB_WORKSPACE/test-bundles/default" "${{ github.sha }}" default
      - name: Clean builder scratch
        if: always()
        run: |
          if [[ -S "$SCCACHE_SERVER_UDS" ]]; then
            sccache --show-stats
            sccache --stop-server
          fi
          rm -rf -- "$TMPDIR"
          if [[ -f src/scripts/ci-cache.py ]]; then
            python3 src/scripts/ci-cache.py --root /target --lock /target/.bookie-build-cache.lock cleanup --min-free-gib 30
          fi


      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  unit:
    runs-on: any-host
    needs: [test-build]
    timeout-minutes: 90
    steps:
      - name: Check out
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Obtain the source-pinned test bundle
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_GITHUB_ARTIFACT_TOKEN: ${{ secrets.BOOKIE_GITHUB_ARTIFACT_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: bash src/scripts/prepare-test-bundle.sh "${{ github.sha }}" default
      - name: Unit tests
        env:
          BOOKIE_TOOL_DIR: /var/cache/ci/tools
        run: |
          cd src
          NEXTEST="$(bash scripts/ensure-nextest.sh)"
          mkdir -p "$CARGO_TARGET_DIR"
          export TMPDIR="$CARGO_TARGET_DIR"
          "$NEXTEST" nextest run --archive-file "$BOOKIE_TEST_BUNDLE/nextest.tar.zst" --workspace-remap "$PWD" --profile ci --no-tests=fail -E 'kind(lib) | kind(bin)'

      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  sandbox:
    runs-on: any-host
    needs: [test-build]
    timeout-minutes: 90
    steps:
      - name: Check out
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Obtain the source-pinned test bundle
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_GITHUB_ARTIFACT_TOKEN: ${{ secrets.BOOKIE_GITHUB_ARTIFACT_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: bash src/scripts/prepare-test-bundle.sh "${{ github.sha }}" default
      - name: Sandbox tier
        env:
          BOOKIE_TOOL_DIR: /var/cache/ci/tools
          BOOKIE_NEXTEST_PROFILE: ci
        run: |
          cd src && bash scripts/test-sandbox.sh

      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  widgets:
    runs-on: any-host
    needs: [test-build]
    timeout-minutes: 90
    steps:
      - name: Check out
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Obtain the source-pinned test bundle
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_GITHUB_ARTIFACT_TOKEN: ${{ secrets.BOOKIE_GITHUB_ARTIFACT_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: bash src/scripts/prepare-test-bundle.sh "${{ github.sha }}" default
      - name: GTK widget tests
        run: |
          cd src && bash scripts/test-gtk-widgets.sh

      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  floor-build:
    runs-on: build-host
    needs: [guards, clippy]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: /target/bookie-${{ github.job }}
      TMPDIR: /target/tmp-${{ github.run_id }}-${{ github.job }}
      CARGO_HOME: /cargo
      BOOKIE_TOOL_DIR: /tools
      CARGO_BUILD_JOBS: "8"
      SCCACHE_DIR: /cargo/sccache
      RUSTC_WRAPPER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      CMAKE_C_COMPILER_LAUNCHER: /tools/sccache
      CMAKE_CXX_COMPILER_LAUNCHER: /tools/sccache
      SCCACHE_BASEDIRS: /target/bookie-${{ github.job }}
      SCCACHE_SERVER_UDS: /target/tmp-${{ github.run_id }}-${{ github.job }}/sccache.sock
      PATH: /tools:/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
    steps:
      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          mkdir -p "$CARGO_TARGET_DIR" "$TMPDIR"
          touch "$CARGO_TARGET_DIR/.bookie-last-used" /target/.bookie-build-cache.lock
          sccache --start-server
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Install package validation tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends desktop-file-utils
      - name: Build the shared release package
        run: |
          exec 9>>/target/.bookie-build-cache.lock
          flock --exclusive 9
          cd src
          DEB_OUT="$GITHUB_WORKSPACE/floor-package" bash scripts/build-deb.sh
          package=$(find "$GITHUB_WORKSPACE/floor-package" -maxdepth 1 -name '*.deb' -print -quit)
          python3 scripts/ci-gtk-artifact.py create --package "$package" "$GITHUB_WORKSPACE/floor-artifact" "${{ github.sha }}"
      - name: Prepare artifact runtime
        run: bash src/scripts/ensure-node.sh >> "$GITHUB_PATH"
      - name: Upload the shared release package
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: floor-package-${{ github.run_id }}-${{ github.sha }}
          path: floor-artifact/
          if-no-files-found: error
          retention-days: 2
      - name: Clean builder scratch
        if: always()
        run: |
          if [[ -S "$SCCACHE_SERVER_UDS" ]]; then
            sccache --show-stats
            sccache --stop-server
          fi
          rm -rf -- "$TMPDIR"
          if [[ -f src/scripts/ci-cache.py ]]; then
            python3 src/scripts/ci-cache.py --root /target --lock /target/.bookie-build-cache.lock cleanup --min-free-gib 30
          fi


      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  distro-floor:
    runs-on: any-host
    needs: [guards, clippy, floor-build]
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: "debian:testing"
            mcp_port_slot: 10
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash src/scripts/docker-hub-login.sh
      - name: Select isolated MCP HTTP port
        run: cd src && python3 scripts/ci-mcp-port.py "${{ matrix.mcp_port_slot }}"
      - name: Prepare artifact runtime
        env:
          BOOKIE_TOOL_DIR: /var/cache/ci/tools
        run: bash src/scripts/ensure-node.sh >> "$GITHUB_PATH"
      - name: Download the shared release package
        uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: floor-package-${{ github.run_id }}-${{ github.sha }}
          path: floor-artifact/
      - name: Verify the shared release package
        run: python3 src/scripts/ci-gtk-artifact.py verify --package "$GITHUB_WORKSPACE/floor-artifact" "${{ github.sha }}" > "$GITHUB_WORKSPACE/floor-package-path"
      - name: Debian package build, install, upgrade from the released package and purge
        run: |
          released=/var/cache/ci/releases/tablepro_0.1.5-1_amd64.deb
          if [ ! -s "$released" ]; then
            mkdir -p "$(dirname "$released")"
            curl -fsSL -o "$released.part" https://github.com/cozyGarage/BookiE/releases/download/linux-v0.1.5/tablepro_0.1.5-1_amd64.deb
            mv "$released.part" "$released"
          fi
          cd src && package=$(cat "$GITHUB_WORKSPACE/floor-package-path") && PREVIOUS_DEB="$released" PREBUILT_DEB="$package" bash scripts/test-deb-package.sh ${{ matrix.base }}
      - name: Finalize runner job
        if: always()
        shell: bash
        run: |
          if [[ -f src/scripts/cleanup-ci-job.sh ]]; then
            bash src/scripts/cleanup-ci-job.sh
          else
            rm -rf -- src gtk-artifact test-bundles floor-artifact floor-package floor-package-path coverage*.json mutants-* soak-*.log
          fi
  distro-floor-scenarios:
    runs-on: any-host
    needs: [distro-floor]
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/floor-debian:testing
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard_group: [1, 2]
    steps:
      - name: Check out
        shell: /usr/local/libexec/bookie-ci-cache checkout --min-free-gib 30 {0}
        env:
          TOKEN: ${{ github.token }}
