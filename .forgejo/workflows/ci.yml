name: lab-ci

on:
  push:
    branches: [linux]
  pull_request:
    branches: [linux]

env:
  CARGO_TERM_COLOR: never
  GITHUB_STEP_SUMMARY: /dev/null

jobs:
  checks:
    runs-on: arch
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Quick layer (guards, formatting, harness, packaging contracts)
        run: cd src/linux && python3 scripts/run-test-layer.py quick
      - name: Clippy
        run: cd src/linux && cargo clippy --workspace --exclude tablepro-driver-duckdb --all-targets -- -D warnings
      - name: Unit tests
        run: cd src/linux && cargo test --workspace --exclude tablepro-driver-duckdb --lib --bins

  widgets:
    runs-on: arch
    needs: checks
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: GTK widget tests
        run: cd src/linux && bash scripts/test-gtk-widgets.sh

  gtk:
    if: github.event_name == 'push'
    runs-on: arch
    needs: widgets
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Installed GTK end-to-end suite
        run: cd src/linux && bash scripts/test-gtk-safety.sh

  servers:
    if: github.event_name == 'push'
    runs-on: arch
    needs: gtk
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: PostgreSQL end-to-end
        run: cd src/linux && bash scripts/test-gtk-postgres.sh
      - name: MySQL end-to-end
        run: cd src/linux && bash scripts/test-gtk-mysql.sh

  distro-floor:
    if: github.event_name == 'push'
    runs-on: arch
    needs: gtk
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Ubuntu 24.04 and Debian 13
        run: cd src/linux && DISTRO_FLOOR_INSTALLED=1 bash scripts/test-distro-floor.sh ubuntu:24.04 debian:13
      - name: Debian package build, install and purge
        run: cd src/linux && bash scripts/test-deb-package.sh ubuntu:24.04 debian:13
