name: lab-ci

on:
  push:
    branches: ["**"]
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: bookie-lab-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: /usr/local/libexec/bookie-ci-cache run {0}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  TABLEPRO_GTK_WAIT_SECONDS: "45"
  TABLEPRO_GTK_SCENARIO_RETRIES: "1"
  GITHUB_STEP_SUMMARY: /dev/null
  PATH: /home/runner/.cargo/bin:/home/ubuntu/.cargo/bin:/usr/local/bin:/usr/bin:/bin
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: /var/cache/ci/sccache
  SCCACHE_CACHE_SIZE: 40G
  CARGO_TARGET_DIR: /var/cache/ci/target/${{ github.job }}
  TMPDIR: /var/cache/ci/target

jobs:
  guards:
    runs-on: build-host
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: /target
      TMPDIR: /target
      CARGO_HOME: /cargo
      TABLEPRO_TOOL_DIR: /tools
      RUSTC_WRAPPER: ""
      PATH: /opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
    steps:
      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Script harness and guards
        run: |
          mkdir -p "$TMPDIR"
          cd src
          cargo fetch --locked --manifest-path apps/linux/app/Cargo.toml
          bash scripts/test-harness.sh
          bash scripts/check-file-size.sh
          bash scripts/check-bounded-operations.sh
          bash scripts/check-panic-sites.sh
          python3 scripts/check-function-size.py
          python3 scripts/check-comment-lines.py
          cargo fmt --all -- --check

  gtk-build:
    runs-on: build-host
    needs: [guards]
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: /cargo
      RUSTC_WRAPPER: ""
      PATH: /opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
      CARGO_TARGET_DIR: /target
      TMPDIR: /target
      TABLEPRO_TOOL_DIR: /tools
      CARGO_PROFILE_CI_STRIP: symbols
    steps:
      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Prepare artifact runtime
        run: bash src/scripts/ensure-node.sh >> "$GITHUB_PATH"
      - name: Build the shared GTK binary
        env:
          CARGO_BUILD_JOBS: "8"
        run: |
          cd src
          cargo build --profile ci --locked -p tablepro-app --bin tablepro-app
          python3 scripts/ci-gtk-artifact.py create "$CARGO_TARGET_DIR/ci/tablepro-app" "$GITHUB_WORKSPACE/gtk-artifact" "${{ github.sha }}"
      - name: Upload the source-pinned GTK binary
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: gtk-ci-${{ github.run_id }}-${{ github.sha }}
          path: gtk-artifact/
          if-no-files-found: error
          retention-days: 2

  clippy:
    runs-on: build-host
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: /target
      CARGO_HOME: /cargo
      TABLEPRO_TOOL_DIR: /tools
      RUSTC_WRAPPER: ""
      PATH: /opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
      TMPDIR: /target
    steps:
      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Clippy
        run: |
          cd src && cargo clippy --workspace --exclude tablepro-driver-duckdb --all-targets -- -D warnings

  test-build:
    runs-on: build-host
    needs: [guards, clippy]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: /target
      TMPDIR: /target
      CARGO_HOME: /cargo
      TABLEPRO_TOOL_DIR: /tools
      CARGO_BUILD_JOBS: "8"
      RUSTC_WRAPPER: ""
      PATH: /opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
      BOOKIE_BUILD_IMAGE: sha256:f21a3d99fb08a940f7fbf775ad6878d52a3fc957876970ae7d0f607b89696ec4
    steps:
      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Build the default test bundle
        run: cd src && bash scripts/build-test-bundles.sh "$GITHUB_WORKSPACE/test-bundles" default
      - name: Publish the default test bundle
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_GITHUB_ARTIFACT_TOKEN: ${{ secrets.BOOKIE_GITHUB_ARTIFACT_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: cd src && python3 scripts/ci-bundle-registry.py publish "$GITHUB_WORKSPACE/test-bundles/default" "${{ github.sha }}" default

  duckdb-build:
    runs-on: build-host
    needs: [test-build]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: /target
      TMPDIR: /target
      CARGO_HOME: /cargo
      TABLEPRO_TOOL_DIR: /tools
      CARGO_BUILD_JOBS: "8"
      RUSTC_WRAPPER: ""
      PATH: /opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
      BOOKIE_BUILD_IMAGE: sha256:f21a3d99fb08a940f7fbf775ad6878d52a3fc957876970ae7d0f607b89696ec4
    steps:
      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Build the DuckDB test bundle
        run: cd src && bash scripts/build-test-bundles.sh "$GITHUB_WORKSPACE/test-bundles" duckdb
      - name: DuckDB analysis and documentation tests
        run: |
          cd src
          cargo clippy --locked -p tablepro-driver-duckdb --all-targets -- -D warnings
          cargo test --locked -p tablepro-driver-duckdb --doc
      - name: Publish the DuckDB test bundle
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_GITHUB_ARTIFACT_TOKEN: ${{ secrets.BOOKIE_GITHUB_ARTIFACT_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: cd src && python3 scripts/ci-bundle-registry.py publish "$GITHUB_WORKSPACE/test-bundles/duckdb" "${{ github.sha }}" duckdb

  unit:
    runs-on: ci-pilot
    needs: [test-build]
    timeout-minutes: 90
    steps:
      - name: Check out
        shell: /usr/local/libexec/bookie-ci-cache checkout {0}
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Obtain the source-pinned test bundle
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_GITHUB_ARTIFACT_TOKEN: ${{ secrets.BOOKIE_GITHUB_ARTIFACT_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: bash src/scripts/prepare-test-bundle.sh "${{ github.sha }}" default
      - name: Unit tests
        env:
          TABLEPRO_TOOL_DIR: /var/cache/ci/tools
        run: |
          cd src
          NEXTEST="$(bash scripts/ensure-nextest.sh)"
          mkdir -p "$CARGO_TARGET_DIR"
          export TMPDIR="$CARGO_TARGET_DIR"
          "$NEXTEST" nextest run --archive-file "$BOOKIE_TEST_BUNDLE/nextest.tar.zst" --workspace-remap "$PWD" --profile ci --no-tests=fail -E 'kind(lib) | kind(bin)'

  sandbox:
    runs-on: ci-pilot
    needs: [test-build]
    timeout-minutes: 90
    steps:
      - name: Check out
        shell: /usr/local/libexec/bookie-ci-cache checkout {0}
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Obtain the source-pinned test bundle
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_GITHUB_ARTIFACT_TOKEN: ${{ secrets.BOOKIE_GITHUB_ARTIFACT_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: bash src/scripts/prepare-test-bundle.sh "${{ github.sha }}" default
      - name: Sandbox tier
        env:
          TABLEPRO_TOOL_DIR: /var/cache/ci/tools
          TABLEPRO_NEXTEST_PROFILE: ci
        run: |
          cd src && bash scripts/test-sandbox.sh

  widgets:
    runs-on: ci-pilot
    needs: [test-build]
    timeout-minutes: 90
    steps:
      - name: Check out
        shell: /usr/local/libexec/bookie-ci-cache checkout {0}
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Obtain the source-pinned test bundle
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_GITHUB_ARTIFACT_TOKEN: ${{ secrets.BOOKIE_GITHUB_ARTIFACT_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: bash src/scripts/prepare-test-bundle.sh "${{ github.sha }}" default
      - name: GTK widget tests
        run: |
          cd src && bash scripts/test-gtk-widgets.sh

  floor-build:
    runs-on: build-host
    needs: [guards, clippy]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: /target
      TMPDIR: /target
      CARGO_HOME: /cargo
      TABLEPRO_TOOL_DIR: /tools
      CARGO_BUILD_JOBS: "8"
      RUSTC_WRAPPER: ""
      PATH: /opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
    steps:
      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Install package validation tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends desktop-file-utils
      - name: Build the shared release package
        run: |
          cd src
          DEB_OUT="$GITHUB_WORKSPACE/floor-package" bash scripts/build-deb.sh
          package=$(find "$GITHUB_WORKSPACE/floor-package" -maxdepth 1 -name '*.deb' -print -quit)
          python3 scripts/ci-gtk-artifact.py create --package "$package" "$GITHUB_WORKSPACE/floor-artifact" "${{ github.sha }}"
      - name: Prepare artifact runtime
        run: bash src/scripts/ensure-node.sh >> "$GITHUB_PATH"
      - name: Upload the shared release package
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: floor-package-${{ github.run_id }}-${{ github.sha }}
          path: floor-artifact/
          if-no-files-found: error
          retention-days: 2

  distro-floor:
    runs-on: ci-pilot
    needs: [guards, clippy, floor-build]
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/floor-${{ matrix.base }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: "debian:testing"
            mcp_port_slot: 10
    steps:
      - name: Check out
        shell: /usr/local/libexec/bookie-ci-cache checkout {0}
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash src/scripts/docker-hub-login.sh
      - name: Select isolated MCP HTTP port
        run: cd src && python3 scripts/ci-mcp-port.py "${{ matrix.mcp_port_slot }}"
      - name: Prepare artifact runtime
        env:
          TABLEPRO_TOOL_DIR: /var/cache/ci/tools
        run: bash src/scripts/ensure-node.sh >> "$GITHUB_PATH"
      - name: Download the shared release package
        uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: floor-package-${{ github.run_id }}-${{ github.sha }}
          path: floor-artifact/
      - name: Verify the shared release package
        run: python3 src/scripts/ci-gtk-artifact.py verify --package "$GITHUB_WORKSPACE/floor-artifact" "${{ github.sha }}" > "$GITHUB_WORKSPACE/floor-package-path"
      - name: Debian package build, install, upgrade from the released package and purge
        run: |
          released=/var/cache/ci/releases/tablepro_0.1.5-1_amd64.deb
          if [ ! -s "$released" ]; then
            mkdir -p "$(dirname "$released")"
            curl -fsSL -o "$released.part" https://github.com/cozyGarage/BookiE/releases/download/linux-v0.1.5/tablepro_0.1.5-1_amd64.deb
            mv "$released.part" "$released"
          fi
          cd src && package=$(cat "$GITHUB_WORKSPACE/floor-package-path") && PREVIOUS_DEB="$released" PREBUILT_DEB="$package" bash scripts/test-deb-package.sh ${{ matrix.base }}
  distro-floor-scenarios:
    runs-on: ci-pilot
    needs: [distro-floor]
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/floor-debian:testing
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out
        shell: /usr/local/libexec/bookie-ci-cache checkout {0}
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Prepare artifact runtime
        env:
          TABLEPRO_TOOL_DIR: /var/cache/ci/tools
        run: bash src/scripts/ensure-node.sh >> "$GITHUB_PATH"
      - name: Download the shared release package
        uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: floor-package-${{ github.run_id }}-${{ github.sha }}
          path: floor-artifact/
      - name: Verify the shared release package
        run: |
          package=$(python3 src/scripts/ci-gtk-artifact.py verify --package "$GITHUB_WORKSPACE/floor-artifact" "${{ github.sha }}")
          printf 'DISTRO_FLOOR_PACKAGE=%s\n' "$package" >> "$GITHUB_ENV"
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash src/scripts/docker-hub-login.sh
      - name: Select isolated MCP HTTP port
        run: cd src && python3 scripts/ci-mcp-port.py "$((10 + ${{ matrix.shard }}))"
      - name: Distro-floor scenario shard
        run: |
          cd src && TABLEPRO_GTK_SHARD=${{ matrix.shard }}/3 bash scripts/test-distro-floor.sh debian:testing

  driver:
    runs-on: ci-pilot
    needs: [guards, clippy, test-build]
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/driver-${{ matrix.driver }}
      TABLEPRO_TEST_RUN_ID: forgejo-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.driver }}
    strategy:
      fail-fast: false
      matrix:
        driver: [postgres, mysql, mssql, clickhouse, redis, mongodb]
    steps:
      - name: Check out
        shell: /usr/local/libexec/bookie-ci-cache checkout {0}
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Obtain the source-pinned test bundle
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_GITHUB_ARTIFACT_TOKEN: ${{ secrets.BOOKIE_GITHUB_ARTIFACT_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: bash src/scripts/prepare-test-bundle.sh "${{ github.sha }}" default
      - name: Docker Hub login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash src/scripts/docker-hub-login.sh
      - name: Pre-pull fixture images
        run: bash src/scripts/prepull-test-images.sh "${{ matrix.driver }}"
      - name: Driver integration
        run: |
          cd src
          cleanup_testcontainers() {
            python3 scripts/cleanup-testcontainers.py "$TABLEPRO_TEST_RUN_ID"
          }
          trap cleanup_testcontainers EXIT
          trap 'cleanup_testcontainers; exit 143' TERM
          trap 'cleanup_testcontainers; exit 130' INT
          bash scripts/run-rust-tests.sh --locked -p tablepro-driver-${{ matrix.driver }} --test integration -- --include-ignored --test-threads=1

  e2e:
    runs-on: ci-pilot
    needs: [guards, clippy, gtk-build, test-build]
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /var/cache/ci/target/gtk-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: postgres
            mcp_port_slot: 5
          - server: mysql
            mcp_port_slot: 6
    steps:
      - name: Check out
        shell: /usr/local/libexec/bookie-ci-cache checkout {0}
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          auth="$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER}/.extraheader" \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git clone --quiet "http://${SERVER#http://}/${{ github.repository }}.git" src
          unset TOKEN auth
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Obtain the source-pinned test bundle
        env:
          BOOKIE_REGISTRY_TOKEN: ${{ secrets.BOOKIE_REGISTRY_TOKEN }}
          BOOKIE_GITHUB_ARTIFACT_TOKEN: ${{ secrets.BOOKIE_GITHUB_ARTIFACT_TOKEN }}
          BOOKIE_REGISTRY_URL: ${{ github.server_url }}/api/packages/trung/generic/bookie-test-bundles
        run: bash src/scripts/prepare-test-bundle.sh "${{ github.sha }}" default
      - name: Prepare artifact runtime
        env:
          TABLEPRO_TOOL_DIR: /var/cache/ci/tools
        run: bash src/scripts/ensure-node.sh >> "$GITHUB_PATH"
      - name: Download the shared GTK binary
        uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: gtk-ci-${{ github.run_id }}-${{ github.sha }}
          path: gtk-artifact/
