name: lab-ci

on:
  push:
    branches: [linux]
  pull_request:
    branches: [linux]

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  GITHUB_STEP_SUMMARY: /dev/null
  PATH: /home/runner/.cargo/bin:/usr/local/bin:/usr/bin:/bin
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: /var/cache/ci/sccache
  SCCACHE_CACHE_SIZE: 40G
  CARGO_TARGET_DIR: /var/cache/ci/target/${{ github.job }}

jobs:
  guards:
    runs-on: debian-host
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Script harness and guards
        run: |
          cd src/linux
          bash scripts/test-harness.sh
          bash scripts/check-file-size.sh
          bash scripts/check-bounded-operations.sh
          bash scripts/check-panic-sites.sh
          python3 scripts/check-function-size.py
          cargo fmt --all -- --check

  clippy:
    runs-on: debian-host
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Clippy
        run: |
          cd src/linux && cargo clippy --workspace --exclude tablepro-driver-duckdb --all-targets -- -D warnings

  unit:
    runs-on: debian-host
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Unit tests
        run: |
          cd src/linux && cargo test --workspace --exclude tablepro-driver-duckdb --lib --bins

  sandbox:
    runs-on: debian-host
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Sandbox tier
        run: |
          cd src/linux && bash scripts/test-sandbox.sh

  widgets:
    runs-on: debian-host
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: GTK widget tests
        run: |
          cd src/linux && bash scripts/test-gtk-widgets.sh

  gtk:
    runs-on: debian-host
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name == 'push'
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Installed GTK end-to-end suite
        run: |
          cd src/linux && bash scripts/test-gtk-safety.sh

  servers:
    runs-on: arch
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name == 'push'
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: PostgreSQL end-to-end
        run: |
          cd src/linux && bash scripts/test-gtk-postgres.sh
      - name: MySQL end-to-end
        run: |
          cd src/linux && bash scripts/test-gtk-mysql.sh

  distro-floor:
    runs-on: debian-host
    needs: [guards, clippy, unit, sandbox, widgets]
    if: github.event_name == 'push'
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          rm -rf src
          git clone --quiet "http://oauth2:${TOKEN}@${SERVER#http://}/${{ github.repository }}.git" src
          git -C src checkout --quiet "${{ github.sha }}"
      - name: Ubuntu 24.04 and Debian 13
        run: |
          cd src/linux && DISTRO_FLOOR_INSTALLED=1 bash scripts/test-distro-floor.sh ubuntu:24.04 debian:13
      - name: Debian package build, install and purge
        run: |
          cd src/linux && bash scripts/test-deb-package.sh ubuntu:24.04 debian:13
