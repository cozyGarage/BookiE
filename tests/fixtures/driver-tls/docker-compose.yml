name: bookie-driver-tls

services:
  mongo:
    build:
      context: .
      dockerfile: mongo/Dockerfile
    restart: on-failure:3
    environment:
      MONGO_INITDB_ROOT_USERNAME: bookie
      MONGO_INITDB_ROOT_PASSWORD: bookie
      MONGO_INITDB_DATABASE: bookie
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro
    command:
      - mongod
      - --tlsMode
      - requireTLS
      - --tlsCertificateKeyFile
      - /certs/server.pem
      - --tlsCAFile
      - /certs/ca.crt
      - --tlsAllowConnectionsWithoutCertificates
      - --bind_ip_all
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --tls
        - --tlsCAFile
        - /certs/ca.crt
        - --host
        - localhost
        - -u
        - bookie
        - -p
        - bookie
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping')"
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:27018:27017"
    networks:
      fixture:
        aliases:
          - mongo.bookie.test

  redis:
    build:
      context: .
      dockerfile: redis/Dockerfile
    command:
      - redis-server
      - --tls-port
      - "6379"
      - --port
      - "0"
      - --tls-cert-file
      - /certs/server.crt
      - --tls-key-file
      - /certs/server.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      - --tls-auth-clients
      - "no"
      - --requirepass
      - bookie
    healthcheck:
      test:
        - CMD
        - redis-cli
        - --tls
        - --cacert
        - /certs/ca.crt
        - -a
        - bookie
        - --no-auth-warning
        - ping
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      fixture:
        aliases:
          - redis.bookie.test

  mongo-plain:
    image: mongo:7
    restart: on-failure:3
    environment:
      MONGO_INITDB_ROOT_USERNAME: bookie
      MONGO_INITDB_ROOT_PASSWORD: bookie
      MONGO_INITDB_DATABASE: bookie
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro
    command: ["mongod", "--bind_ip_all"]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --host
        - localhost
        - -u
        - bookie
        - -p
        - bookie
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping')"
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:27019:27017"
    networks:
      - fixture

  redis-plain:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "bookie"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "bookie", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:6381:6379"
    networks:
      - fixture

  mysql:
    build:
      context: .
      dockerfile: mysql/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: bookie
      MYSQL_DATABASE: bookie
      MYSQL_USER: bookie
      MYSQL_PASSWORD: bookie
    command:
      - mysqld
      - --require_secure_transport=ON
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    healthcheck:
      # `mysqladmin ping` reports the server alive before initialisation has
      # created the application user, which lets tests start too early. Run a
      # real authenticated query instead, over the local socket so that
      # require_secure_transport does not apply to the probe itself.
      test:
        - CMD
        - mysql
        - --protocol=socket
        - -ubookie
        - -pbookie
        - -Dbookie
        - -e
        - "SELECT 1"
      interval: 3s
      timeout: 5s
      retries: 60
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      fixture:
        aliases:
          - mysql.bookie.test

  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    environment:
      POSTGRES_USER: bookie
      POSTGRES_PASSWORD: bookie
      POSTGRES_DB: bookie
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "bookie", "-d", "bookie"]
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:5436:5432"
    networks:
      - fixture

  mysql-ssh:
    build:
      context: .
      dockerfile: mysql/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: bookie
      MYSQL_DATABASE: bookie
      MYSQL_USER: bookie
      MYSQL_PASSWORD: bookie
    command:
      - mysqld
      - --require_secure_transport=ON
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    healthcheck:
      test:
        - CMD
        - mysql
        - --protocol=socket
        - -ubookie
        - -pbookie
        - -Dbookie
        - -e
        - "SELECT 1"
      interval: 3s
      timeout: 5s
      retries: 60
    networks:
      fixture:
        aliases:
          - mysql-ssh.bookie.test

  mysql-mtls:
    build:
      context: .
      dockerfile: mysql-mtls/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: bookie
      MYSQL_DATABASE: bookie
      MYSQL_USER: bookie_mtls
      MYSQL_PASSWORD: bookie
    command:
      - mysqld
      - --require_secure_transport=ON
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    healthcheck:
      test:
        - CMD
        - mysql
        - --protocol=socket
        - -uroot
        - -pbookie
        - -Dbookie
        - -e
        - "SELECT 1"
      interval: 3s
      timeout: 5s
      retries: 60
    ports:
      - "127.0.0.1:3309:3306"
    networks:
      fixture:
        aliases:
          - mysql-mtls.bookie.test

  mysql-mtls-ssh:
    build:
      context: .
      dockerfile: mysql-mtls/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: bookie
      MYSQL_DATABASE: bookie
      MYSQL_USER: bookie_mtls
      MYSQL_PASSWORD: bookie
    command:
      - mysqld
      - --require_secure_transport=ON
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    healthcheck:
      test:
        - CMD
        - mysql
        - --protocol=socket
        - -uroot
        - -pbookie
        - -Dbookie
        - -e
        - "SELECT 1"
      interval: 3s
      timeout: 5s
      retries: 60
    networks:
      fixture:
        aliases:
          - mysql-mtls-ssh.bookie.test

  ssh-bastion:
    build:
      context: .
      dockerfile: ssh-bastion/Dockerfile
    ports:
      - "127.0.0.1:2224:2222"
    networks:
      - fixture
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2222"]
      interval: 2s
      timeout: 3s
      retries: 20

  clickhouse:
    build:
      context: .
      dockerfile: clickhouse/Dockerfile
    environment:
      CLICKHOUSE_USER: bookie
      CLICKHOUSE_PASSWORD: bookie
      CLICKHOUSE_DB: bookie
    healthcheck:
      test:
        - CMD
        - clickhouse-client
        - --user
        - bookie
        - --password
        - bookie
        - --query
        - "SELECT 1"
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:8444:8443"
    networks:
      fixture:
        aliases:
          - clickhouse.bookie.test

  mysql-plain:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: bookie
      MYSQL_DATABASE: bookie
      MYSQL_USER: bookie
      MYSQL_PASSWORD: bookie
    command: ["mysqld", "--tls-version="]
    healthcheck:
      test:
        - CMD
        - mysql
        - --protocol=socket
        - -ubookie
        - -pbookie
        - -Dbookie
        - -e
        - "SELECT 1"
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 240s
    ports:
      - "127.0.0.1:3308:3306"
    networks:
      - fixture

  clickhouse-plain:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: bookie
      CLICKHOUSE_PASSWORD: bookie
      CLICKHOUSE_DB: bookie
    healthcheck:
      test:
        - CMD
        - clickhouse-client
        - --user
        - bookie
        - --password
        - bookie
        - --query
        - "SELECT 1"
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:8445:8123"
    networks:
      - fixture

  mssql:
    build:
      context: .
      dockerfile: mssql/Dockerfile
      args:
        TLS_ENABLED: "1"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "BookiE_fixture!2026"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U bookie -P bookie -d bookie -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 60
    ports:
      - "127.0.0.1:1434:1433"
    networks:
      fixture:
        aliases:
          - mssql.bookie.test

  mssql-ssh:
    build:
      context: .
      dockerfile: mssql/Dockerfile
      args:
        TLS_ENABLED: "1"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "BookiE_fixture!2026"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U bookie -P bookie -d bookie -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 60
    networks:
      fixture:
        aliases:
          - mssql-ssh.bookie.test

  mssql-plain:
    build:
      context: .
      dockerfile: mssql/Dockerfile
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "BookiE_fixture!2026"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U bookie -P bookie -d bookie -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 60
    ports:
      - "127.0.0.1:1435:1433"
    networks:
      - fixture

networks:
  fixture:
    driver: bridge
