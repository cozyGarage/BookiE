engine = "duckdb"
servers = ["duckdb"]

[[case]]
id = "tinyint"
type = "TINYINT"
literals = ["-128", "127", "NULL"]
carrier = "Int"
rule = "exact"

[[case]]
id = "unsigned-small"
type = "UINTEGER"
literals = ["0", "4294967295"]
carrier = "Int"
rule = "exact"

[[case]]
id = "bigint"
type = "BIGINT"
literals = ["NULL"]
literals_from = "integers"
carrier = "Int"
rule = "exact"

[[case]]
id = "ubigint-in-i64"
type = "UBIGINT"
literals = ["0", "9223372036854775807"]
carrier = "Int"
rule = "exact"

[[case]]
id = "ubigint-beyond-i64"
type = "UBIGINT"
literals = ["9223372036854775808", "18446744073709551615"]
carrier = "Text"
rule = "exact"

[[case]]
id = "hugeint"
type = "HUGEINT"
literals = ["-170141183460469231731687303715884105728", "170141183460469231731687303715884105727", "0", "9223372036854775808"]
carrier = "Text"
rule = "exact"
note = "HUGEINT is wider than i64; values keep the exact server digits."

[[case]]
id = "hugeint-small"
type = "HUGEINT"
literals = ["-1", "42"]
carrier = "Text"
rule = "exact"

[[case]]
id = "uhugeint"
type = "UHUGEINT"
literals = ["0", "340282366920938463463374607431768211455"]
carrier = "Text"
rule = "exact"

[[case]]
id = "decimal-scaled"
type = "DECIMAL(18,8)"
literals = ["NULL", "0", "-0.00000001", "1.23", "-9999999999.99999999"]
carrier = "Decimal"
rule = "exact"

[[case]]
id = "decimal-wide"
type = "DECIMAL(38,10)"
literals = ["-0.0000000001", "1.5", "123456789012345678.0123456789"]
carrier = "Decimal"
rule = "exact"

[[case]]
id = "decimal-beyond-rust-decimal"
type = "DECIMAL(38,0)"
literals = ["99999999999999999999999999999999999999", "-79228162514264337593543950336"]
carrier = "Text"
rule = "exact"

[[case]]
id = "decimal-38-10-beyond-rust-decimal"
type = "DECIMAL(38,10)"
literals = ["1234567890123456789012345678.0123456789"]
carrier = "Text"
rule = "exact"

[[case]]
id = "double"
type = "DOUBLE"
literals = ["NULL", "'-0.0'", "'inf'", "'-inf'", "'nan'", "4.9e-324", "1.7976931348623157e308", "0.30000000000000004"]
literals_from = "floats"
carrier = "Float"
rule = "float"

[[case]]
id = "float"
type = "FLOAT"
literals = ["0.1", "'-0.0'", "1e-45", "3.4028235e38", "'inf'", "'nan'", "16777217"]
carrier = "Float"
rule = "float32"
referee = "CAST({v} AS DOUBLE)"

[[case]]
id = "boolean"
type = "BOOLEAN"
literals = ["true", "false", "NULL"]
carrier = "Bool"
rule = "bool"

[[case]]
id = "varchar-contract"
type = "VARCHAR"
literals = ["NULL"]
literals_from = "texts"
carrier = "Text"
rule = "exact"

[[case]]
id = "varchar-edges"
type = "VARCHAR"
literals = ["'trailing  '", "'a' || chr(0) || 'b'", "'e' || chr(769) || ' combining'", "'👩‍👩‍👧 zwj'", "repeat('é', 70000)", "repeat('x', 262145)"]
carrier = "Text"
rule = "exact"

[[case]]
id = "blob"
type = "BLOB"
literals = ["'\\xDE\\xAD\\xBE\\xEF'::BLOB", "''::BLOB", "'\\x00'::BLOB", "NULL"]
carrier = "Bytes"
rule = "bytes"

[[case]]
id = "date"
type = "DATE"
literals = ["'2024-02-29'", "'1970-01-01'", "'0001-01-01'", "'9999-12-31'", "NULL"]
carrier = "Date"
rule = "exact"

[[case]]
id = "date-infinity"
type = "DATE"
literals = ["'infinity'", "'-infinity'"]
carrier = "Text"
rule = "exact"

[[case]]
id = "time"
type = "TIME"
literals = ["'00:00:00'", "'13:45:30.123456'", "'23:59:59.999999'"]
carrier = "Time"
rule = "temporal"

[[case]]
id = "timestamp"
type = "TIMESTAMP"
literals = ["'2024-02-29 13:45:30.123456'", "'1970-01-01 00:00:00'", "'0001-01-01 00:00:00'", "'9999-12-31 23:59:59.999999'", "NULL"]
carrier = "DateTime"
rule = "temporal"

[[case]]
id = "timestamp-ns"
type = "TIMESTAMP_NS"
literals = ["'2024-02-29 13:45:30.123456789'", "'1970-01-01 00:00:00.000000001'", "'1969-12-31 23:59:59.999999999'"]
carrier = "DateTime"
rule = "instant"
note = "Nanoseconds must survive; the referee is epoch_ns of the stored value."

[[case]]
id = "timestamptz"
type = "TIMESTAMPTZ"
literals = ["'2024-02-29 13:45:30.123456+05:30'", "'1970-01-01 00:00:00+00'", "'2024-03-10 02:30:00-05'", "NULL"]
carrier = "TimestampTz"
rule = "instant"

[[case]]
id = "interval"
type = "INTERVAL"
note = "BookiE spells intervals as months, days and microseconds; the server casts that text back to compare it with its own rendering."
literals = ["INTERVAL '1 year 2 months 3 days 04:05:06.789'", "INTERVAL '-1 day'", "INTERVAL '0 seconds'", "INTERVAL '1 month -1 day'"]
carrier = "Text"
rule = "server_cast"

[[case]]
id = "uuid"
type = "UUID"
literals = ["'12345678-9abc-def0-1122-334455667788'", "'00000000-0000-0000-0000-000000000000'", "'ffffffff-ffff-ffff-ffff-ffffffffffff'", "NULL"]
carrier = "Uuid"
rule = "exact"

[[case]]
id = "json"
type = "JSON"
literals = ["'{\"b\":1,\"a\":2}'", "'{\"a\":1,\"a\":2}'", "'[1, 2.50, 1e400]'", "'null'"]
carrier = "JsonText"
rule = "exact"
note = "DuckDB JSON keeps its source text exactly."
known_failing = [
    { route = "query", issue = 4231, expect = "expected carrier JsonText, BookiE has Text", reason = "DuckDB JSON reads as Text" },
    { route = "browse", issue = 4231, expect = "expected carrier JsonText, BookiE has Text", reason = "DuckDB JSON reads as Text" },
    { route = "param_where", issue = 4231, expect = "expected carrier JsonText, BookiE has Text", reason = "DuckDB JSON reads as Text" },
    { route = "param_select", issue = 4231, expect = "expected carrier JsonText, BookiE has Text", reason = "DuckDB JSON reads as Text" },
    { route = "export_json", issue = 4223, expect = "server", reason = "JSON export writes a JSON null document like SQL NULL" },
    { route = "export_json_lines", issue = 4223, expect = "server", reason = "JSON export writes a JSON null document like SQL NULL" },
]

[[case]]
id = "list"
type = "INTEGER[]"
literals = ["[1, 2, 3]", "[]", "[NULL, 1]", "NULL"]
carrier = "Undecodable"
rule = "refusal"
expect_error = [{ route = "param_select", expect = "cannot be bound", reason = "an undecodable cell cannot be bound back as a parameter" }]

[[case]]
id = "nested-list"
type = "INTEGER[][]"
literals = ["[[1, 2], [3], []]"]
carrier = "Undecodable"
rule = "refusal"
expect_error = [{ route = "param_select", expect = "cannot be bound", reason = "an undecodable cell cannot be bound back as a parameter" }]

[[case]]
id = "struct"
type = "STRUCT(a INTEGER, b VARCHAR)"
literals = ["{'a': 1, 'b': 'x y'}", "{'a': NULL, 'b': ''}"]
carrier = "Undecodable"
rule = "refusal"
expect_error = [{ route = "param_select", expect = "policy denied", reason = "an undecodable cell cannot be bound back as a parameter" }]

[[case]]
id = "map"
type = "MAP(VARCHAR, INTEGER)"
literals = ["MAP {'k': 1, 'z': 2}", "MAP {}"]
carrier = "Undecodable"
rule = "refusal"
expect_error = [{ route = "param_select", expect = "cannot be bound", reason = "an undecodable cell cannot be bound back as a parameter" }]

[[case]]
id = "union"
type = "UNION(num INTEGER, str VARCHAR)"
literals = ["union_value(num := 2)", "union_value(str := 'x')"]
carrier = "Undecodable"
rule = "refusal"
expect_error = [{ route = "param_select", expect = "cannot be bound", reason = "an undecodable cell cannot be bound back as a parameter" }]
known_failing = [
    { route = "import_csv", issue = 4219, expect = "server stored", reason = "import stores the undecodable export marker as a value" },
    { route = "import_xlsx", issue = 4219, expect = "server stored", reason = "import stores the undecodable export marker as a value" },
]

[[case]]
id = "enum"
type = "ENUM('sad', 'ok', 'with space')"
literals = ["'sad'", "'with space'", "NULL"]
carrier = "Text"
rule = "exact"

[[case]]
id = "bit"
type = "BIT"
literals = ["'101010'", "'0'"]
carrier = "Text"
rule = "exact"

[[case]]
id = "smallint"
type = "SMALLINT"
literals = ["-32768", "32767"]
carrier = "Int"
rule = "exact"

[[case]]
id = "integer"
type = "INTEGER"
literals = ["-2147483648", "2147483647"]
carrier = "Int"
rule = "exact"

[[case]]
id = "usmallint"
type = "USMALLINT"
literals = ["0", "65535"]
carrier = "Int"
rule = "exact"

[[case]]
id = "utinyint"
type = "UTINYINT"
literals = ["0", "255"]
carrier = "Int"
rule = "exact"

[[case]]
id = "decimal-4-2"
type = "DECIMAL(4,2)"
literals = ["12.34", "-99.99", "0.00", "0.10"]
carrier = "Decimal"
rule = "exact"
note = "DECIMAL(4,2) is stored as a 16-bit integer."

[[case]]
id = "decimal-9-3"
type = "DECIMAL(9,3)"
literals = ["123456.789", "-0.001", "0"]
carrier = "Decimal"
rule = "exact"
note = "DECIMAL(9,3) is stored as a 32-bit integer."

[[case]]
id = "timestamp-s"
type = "TIMESTAMP_S"
literals = ["'2024-02-29 13:45:30'", "'1970-01-01 00:00:00'"]
carrier = "DateTime"
rule = "temporal"

[[case]]
id = "timestamp-ms"
type = "TIMESTAMP_MS"
literals = ["'2024-02-29 13:45:30.123'", "'1969-12-31 23:59:59.999'"]
carrier = "DateTime"
rule = "temporal"

[[case]]
id = "timestamp-infinity"
type = "TIMESTAMP"
literals = ["'infinity'", "'-infinity'"]
carrier = "Text"
rule = "exact"

[[case]]
id = "timetz"
type = "TIMETZ"
literals = ["'13:45:30+05:30'", "'00:00:00-12'"]
carrier = "Undecodable"
rule = "refusal"
expect_error = [{ route = "param_select", expect = "cannot be bound", reason = "an undecodable cell cannot be bound back as a parameter" }]

[[case]]
id = "fixed-array"
type = "INTEGER[3]"
literals = ["[1, 2, 3]", "[NULL, 0, -1]"]
carrier = "Undecodable"
rule = "refusal"
expect_error = [{ route = "param_select", expect = "cannot be bound", reason = "an undecodable cell cannot be bound back as a parameter" }]

[[case]]
id = "timestamptz-session-zone"
type = "TIMESTAMPTZ"
bookie_session = ["TimeZone = 'America/New_York'"]
literals = ["'2024-02-29 13:45:30.123456+05:30'", "'2024-11-03 05:30:00+00'"]
carrier = "TimestampTz"
rule = "instant"
note = "BookiE's session sets TimeZone first, as a user would in the editor; the stored instants must not move."
