[[case]]
id = "float"
type = "FLOAT"
literals = ["0.1", "1.5", "-0", "1.17549435e-38", "3.40282e38", "16777217", "NULL"]
carrier = "Float"
rule = "float32"
referee = "CAST({v} AS DOUBLE)"
note = "CAST(float AS CHAR) prints six significant digits, so the referee widens the stored single to a double; BookiE widens through the shortest single decimal, so values compare at single precision."
known_failing = [{ route = "param_select", issue = 4094, reason = "SELECT ? decodes the executed column with the prepare-time VARCHAR or NULL plan" }]

[[case]]
id = "double"
type = "DOUBLE"
