[[case]]
id = "tinyint1-non-flag"
type = "TINYINT(1)"
literals = ["2", "-1", "127"]
carrier = "Int"
rule = "exact"
note = "TINYINT(1) is only a display width; a stored 2 is 2, and reading it as true would change the value."
known_failing = [{ route = "param_select", issue = 4094, reason = "SELECT ? decodes the executed column with the prepare-time VARCHAR or NULL plan" }]

[[case]]
id = "bit1"
type = "BIT(1)"
literals = ["b'0'", "b'1'", "NULL"]
carrier = "Int"
rule = "number"
referee = "CAST({v} + 0 AS CHAR)"
note = "BIT reads as an integer while it fits i64; the referee is the server's numeric value of the bits."
known_failing = [{ route = "param_select", issue = 4094, reason = "SELECT ? decodes the executed column with the prepare-time VARCHAR or NULL plan" }]

[[case]]
id = "bit64-in-i64"
type = "BIT(64)"
