carrier = "Float"
rule = "float"
known_failing = [{ route = "param_select", issue = 4094, reason = "SELECT ? decodes the executed column with the prepare-time VARCHAR or NULL plan" }]

[[case]]
id = "varchar-contract"
type = "VARCHAR(100)"
literals = ["NULL"]
literals_from = "texts"
carrier = "Text"
rule = "exact"

[[case]]
id = "varchar-edges"
type = "VARCHAR(100)"
literals = ["'trailing  '", "'  leading'", "'a\\0b'", "'e\u0301 combining'", "'שלום RTL'", "'👩‍👩‍👧 zwj'", "'\\r\\n'"]
carrier = "Text"
rule = "exact"
note = "MySQL VARCHAR keeps NUL and trailing spaces."
known_failing = [
    { route = "copy_tsv", issue = 4221, reason = "pasting a quoted TSV cell keeps the formula guard" },
]

[[case]]
id = "char"
type = "CHAR(10)"
literals = ["'abc'", "'abc  '", "''", "NULL"]
carrier = "Text"
rule = "exact"
note = "Without PAD_CHAR_TO_FULL_LENGTH the server strips CHAR padding on retrieval; that retrieval is the referee."

