literals = ["0", "9999999999999999.9999", "1.5"]
carrier = "Decimal"
rule = "exact"

[[case]]
id = "uuid-mariadb"
type = "UUID"
servers = ["mariadb-11"]
literals = ["'123e4567-e89b-42d3-a456-426614174000'", "'018f8e2c-7b6a-7c3d-8e9f-0a1b2c3d4e5f'", "'00000000-0000-0000-0000-000000000000'", "NULL"]
carrier = "Text"
rule = "exact"
note = "MariaDB 11 refuses UUID text with an unknown version or variant, so the rows use version 4, version 7 and the nil UUID."

