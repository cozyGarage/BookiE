carrier = "Text"
rule = "exact"

[[case]]
id = "json-numbers-and-escapes"
type = "JSON"
servers = ["mysql-8.4"]
literals = ["'{\"n\": 12345678901234567890123, \"m\": 18446744073709551615, \"f\": 1e300}'", "'\"\\\\u00e9\\\\u0000\\\\ud83d\\\\ude00\"'", "'{\"\\\\u0061\": 1}'"]
carrier = "Json"
rule = "json"
param = "SELECT CAST(? AS JSON)"
note = "MySQL parses JSON numbers past u64 as doubles and stores escapes decoded; the server's rendering is the referee."

[[case]]
id = "json-numbers-and-escapes-mariadb"
type = "JSON"
servers = ["mariadb-11"]
literals = ["'{\"n\": 12345678901234567890123}'", "'\"\\\\u00e9\\\\u0000\"'"]
carrier = "Text"
rule = "exact"
note = "MariaDB JSON is LONGTEXT; the source text, escapes and digits included, is the value."

[[case]]
id = "expression-comparison"
type = "TINYINT(1)"
literals = ["1=1", "1=0", "NULL=1"]
carrier = "Bool"
rule = "bool"
param = "SELECT (? = 1)"
param_carrier = "Int"
param_rule = "exact"
note = "SELECT (? = 1) is an expression column: the server types a comparison as BIGINT, so the echo is an integer 0 or 1."
