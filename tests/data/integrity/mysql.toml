[[case]]
id = "json"
type = "JSON"
servers = ["mysql-8.4"]
literals = ["'{\"b\":1,\"a\":2}'", "'{\"a\":1,\"a\":2}'", "'[1, 2.50, true, null]'", "'{\"nested\": {\"x\": [null, \"é\"]}}'", "'null'", "NULL"]
carrier = "Json"
rule = "json"
param = "SELECT CAST(? AS JSON)"
note = "MySQL stores JSON in a normalized binary form; the server's text rendering is the referee."
known_failing = [
    { route = "export_json", issue = 4223, reason = "JSON export cannot tell a JSON null document or json text from SQL NULL or text" },
    { route = "export_json_lines", issue = 4223, reason = "JSON export cannot tell a JSON null document or json text from SQL NULL or text" },
]

[[case]]
id = "json-mariadb"
type = "JSON"
servers = ["mariadb-11"]
literals = ["'{\"b\":1,\"a\":2}'", "'{\"a\":1,\"a\":2}'", "'  [1, 2.50]  '"]
carrier = "Text"
rule = "exact"
note = "MariaDB JSON is LONGTEXT with a validity check; the source text is the value."

[[case]]
id = "geometry"
type = "GEOMETRY"
text_referee = "ST_AsText({v})"
literals = ["ST_GeomFromText('POINT(1 2)')", "ST_GeomFromText('LINESTRING(0 0, 1 1)', 4326)"]
carrier = "Bytes"
rule = "bytes"
note = "The referee is the stored internal format: a 4-byte SRID followed by WKB."
known_failing = [{ route = "param_select", issue = 4094, reason = "SELECT ? decodes the executed column with the prepare-time VARCHAR or NULL plan" }]
