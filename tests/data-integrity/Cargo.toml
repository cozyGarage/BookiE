[package]
name = "bookie-data-integrity-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "bookie_data_integrity"
path = "src/lib.rs"

[dependencies]
bookie-app-services = { path = "../../crates/app-services" }
bookie-core = { path = "../../crates/core" }
bookie-driver-registry = { path = "../../crates/registry" }
bookie-policy = { path = "../../crates/policy" }
bookie-storage = { path = "../../crates/storage" }
bookie-transport = { path = "../../crates/transport" }
chrono.workspace = true
csv.workspace = true
duckdb = { version = "1.20000", features = ["bundled"] }
hex.workspace = true
rust_decimal.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["sqlite-unbundled"] }
tempfile.workspace = true
testcontainers = { workspace = true, features = ["http_wait_plain"] }
testcontainers-modules = { workspace = true, features = ["postgres", "mysql", "redis"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml.workspace = true
uuid.workspace = true

[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "deny"
unimplemented = "deny"
