[package]
name = "bookie-driver-tls-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "bookie_driver_tls_tests"
path = "src/lib.rs"

[features]
default = []
mssql-kerberos = ["bookie-driver-mssql/kerberos"]

[[test]]
name = "mssql_kerberos"
path = "tests/mssql_kerberos.rs"
required-features = ["mssql-kerberos"]

[dependencies]
bookie-core = { path = "../../crates/core" }
bookie-ssh = { path = "../../crates/ssh" }
bookie-transport = { path = "../../crates/transport" }
secrecy.workspace = true

[dev-dependencies]
bookie-driver-clickhouse = { path = "../../crates/drivers/clickhouse" }
bookie-driver-mongodb = { path = "../../crates/drivers/mongodb" }
bookie-driver-mssql = { path = "../../crates/drivers/mssql" }
bookie-driver-mysql = { path = "../../crates/drivers/mysql" }
bookie-driver-postgres = { path = "../../crates/drivers/postgres" }
bookie-driver-redis = { path = "../../crates/drivers/redis" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }


[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "deny"
unimplemented = "deny"
