[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/core",
    "crates/policy",
    "crates/release-tests",
    "crates/mcp",
    "crates/agentd",
    "crates/ssh",
    "crates/storage",
    "crates/transport",
    "crates/driver-tls-tests",
    "crates/drivers/clickhouse",
    "crates/drivers/duckdb",
    "crates/drivers/mongodb",
    "crates/drivers/mssql",
    "crates/drivers/mysql",
    "crates/drivers/postgres",
    "crates/drivers/redis",
    "crates/drivers/sqlite",
]
[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
async-channel = "2"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-util = { version = "0.7", default-features = false }
russh = "0.63"
secrecy = { version = "0.10", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clickhouse = { version = "0.15", default-features = false, features = ["rustls-tls-aws-lc", "rustls-tls-webpki-roots"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "chrono", "rust_decimal", "uuid", "json"] }
# native-tls (OpenSSL on Linux) avoids tiberius's pinned rustls 0.21 /
# rustls-webpki 0.101 stack, which still carries known advisories.
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "chrono", "rust_decimal"] }
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rust_decimal = { version = "1.43", default-features = false, features = ["serde", "std"] }
futures = "0.3"
gtk4 = { version = "0.11", features = ["gnome_50"] }
libadwaita = { version = "0.9", features = ["v1_9"] }
sourceview5 = { version = "0.11", features = ["v5_18"] }
glib = { version = "0.22", features = ["v2_88"] }
glib-build-tools = "0.22"
libsqlite3-sys = ">=0.30.1, <0.38.0"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
testcontainers = { version = "0.27", default-features = false, features = ["aws-lc-rs"] }
testcontainers-modules = { version = "0.15", default-features = false, features = ["aws-lc-rs"] }
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
relm4 = { version = "0.11", default-features = false, features = ["macros", "libadwaita"] }
sqlparser = "0.58"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
libc = "0.2"

[patch.crates-io]
tiberius = { git = "https://github.com/tiberius-rs/tiberius", rev = "c1d2e741ee6fe0935091826d91fb5886b6a4082a" }
sqlx-postgres = { path = "vendor/sqlx-postgres" }
mongodb = { path = "vendor/mongodb" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
