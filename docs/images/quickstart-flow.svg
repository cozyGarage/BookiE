<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="240" viewBox="0 0 1250 240" role="img" aria-label="BookiE Quickstart Workflow">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2421"/>
      <stop offset="100%" stop-color="#14312D"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#183D37" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#112925" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container background -->
  <rect width="1250" height="240" rx="16" fill="url(#bg)" stroke="#1F4F48" stroke-width="1.5"/>

  <!-- Connecting arrows between cards -->
  <g stroke="#C9A24B" stroke-width="2" fill="#C9A24B">
    <!-- 1 -> 2 -->
    <path d="M 300 120 L 332 120" stroke-dasharray="4 3"/>
    <polygon points="332,115 340,120 332,125"/>

    <!-- 2 -> 3 -->
    <path d="M 605 120 L 637 120" stroke-dasharray="4 3"/>
    <polygon points="637,115 645,120 637,125"/>

    <!-- 3 -> 4 -->
    <path d="M 910 120 L 942 120" stroke-dasharray="4 3"/>
    <polygon points="942,115 950,120 942,125"/>
  </g>

  <!-- Step 1: Connect -->
  <g transform="translate(35, 25)" filter="url(#shadow)">
    <rect width="265" height="190" rx="12" fill="url(#cardGrad)" stroke="#1F4F48" stroke-width="1.5"/>
    <rect x="18" y="16" width="30" height="30" rx="8" fill="#1F4F48"/>
    <text x="33" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#C9A24B" text-anchor="middle">1</text>
    <text x="58" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#F3EAD6">Connect</text>
    <text x="18" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#9EAE9A">11 Native Engines</text>
    <text x="18" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#F3EAD6">Postgres, MySQL, SQLite, MSSQL,</text>
    <text x="18" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#F3EAD6">ClickHouse, DuckDB, Scylla, Oracle…</text>
    <line x1="18" y1="112" x2="247" y2="112" stroke="#1F4F48" stroke-width="1"/>
    <text x="18" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#C5D0C2">• Secret Service OS keyring</text>
    <text x="18" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#C5D0C2">• Multi-hop SSH jump hosts</text>
    <text x="18" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#C5D0C2">• DBX &amp; DBeaver connection import</text>
  </g>

  <!-- Step 2: Browse & Edit -->
  <g transform="translate(340, 25)" filter="url(#shadow)">
    <rect width="265" height="190" rx="12" fill="url(#cardGrad)" stroke="#1F4F48" stroke-width="1.5"/>
    <rect x="18" y="16" width="30" height="30" rx="8" fill="#1F4F48"/>
    <text x="33" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#C9A24B" text-anchor="middle">2</text>
    <text x="58" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#F3EAD6">Browse &amp; Edit</text>
    <text x="18" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#9EAE9A">High-Performance Grid</text>
    <text x="18" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#F3EAD6">Seek-based keyset pagination with</text>
    <text x="18" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#F3EAD6">instant local filters &amp; multi-sort</text>
    <line x1="18" y1="112" x2="247" y2="112" stroke="#1F4F48" stroke-width="1"/>
    <text x="18" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#C5D0C2">• Staged cell edits &amp; bulk updates</text>
    <text x="18" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#C5D0C2">• Foreign-key jump &amp; navigation</text>
    <text x="18" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#C5D0C2">• Decoded previews &amp; 15s auto-refresh</text>
  </g>

  <!-- Step 3: Write SQL -->
  <g transform="translate(645, 25)" filter="url(#shadow)">
    <rect width="265" height="190" rx="12" fill="url(#cardGrad)" stroke="#1F4F48" stroke-width="1.5"/>
    <rect x="18" y="16" width="30" height="30" rx="8" fill="#1F4F48"/>
    <text x="33" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#C9A24B" text-anchor="middle">3</text>
    <text x="58" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#F3EAD6">Write SQL</text>
    <text x="18" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#9EAE9A">GtkSourceView Editor</text>
    <text x="18" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#F3EAD6">Fast syntax shading, completions,</text>
    <text x="18" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#F3EAD6">bracket matching &amp; split views</text>
    <line x1="18" y1="112" x2="247" y2="112" stroke="#1F4F48" stroke-width="1"/>
    <text x="18" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#C5D0C2">• Named parameter binding (:id)</text>
    <text x="18" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#C5D0C2">• 64 MiB stream window &amp; spool</text>
    <text x="18" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#C5D0C2">• Server notices &amp; messages panel</text>
  </g>

  <!-- Step 4: Policy & Audit -->
  <g transform="translate(950, 25)" filter="url(#shadow)">
    <rect width="265" height="190" rx="12" fill="url(#cardGrad)" stroke="#1F4F48" stroke-width="1.5"/>
    <rect x="18" y="16" width="30" height="30" rx="8" fill="#1F4F48"/>
    <text x="33" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#C9A24B" text-anchor="middle">4</text>
    <text x="58" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#F3EAD6">Policy &amp; Audit</text>
    <text x="18" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#9EAE9A">PolicyGuard Engine</text>
    <text x="18" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#F3EAD6">Transparent local policy checks</text>
    <text x="18" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#F3EAD6">before any statement executes</text>
    <line x1="18" y1="112" x2="247" y2="112" stroke="#1F4F48" stroke-width="1"/>
    <text x="18" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#C5D0C2">• Write policy approvals</text>
    <text x="18" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#C5D0C2">• Local encrypted audit journal</text>
    <text x="18" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#C5D0C2">• Model Context Protocol (MCP)</text>
  </g>
</svg>
