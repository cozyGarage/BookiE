[package]
name = "bookie-gpui"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
bookie-core = { path = "../../crates/core" }
bookie-results = { path = "../../crates/results" }
bookie-app-services = { path = "../../crates/app-services" }
bookie-driver-registry = { path = "../../crates/registry" }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
serde_json = "1"
uuid = "1"
unicode-segmentation = "1"
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11" }
gpui_macros = { package = "gpui-pre-macros", version = "=0.3.11" }
gpui-kit = "=0.9.0"
gpui-component = { version = "=0.9.0", features = ["tree-sitter-sql"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
gpui-kit = { version = "=0.9.0", features = ["test-support"] }

[patch.crates-io]
sqlx-mysql = { path = "../../vendor/sqlx-mysql" }
sqlx-sqlite = { path = "../../vendor/sqlx-sqlite" }
sqlx-postgres = { path = "../../vendor/sqlx-postgres" }
mongodb = { path = "../../vendor/mongodb" }
redis = { path = "../../vendor/redis" }
