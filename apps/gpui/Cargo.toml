[package]
name = "bookie-gpui"
version = "0.2.8"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
bookie-core = { path = "../../crates/core" }
bookie-results = { path = "../../crates/results" }
bookie-app-services = { path = "../../crates/app-services" }
bookie-driver-registry = { path = "../../crates/registry" }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync"] }
tokio-util = { version = "0.7", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
serde_json = "1"
secrecy = "0.10"
uuid = { version = "1", features = ["v5"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
unicode-segmentation = "1"
regex = "1"
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11" }
gpui_macros = { package = "gpui-pre-macros", version = "=0.3.11" }
gpui-kit = "=0.9.0"
gpui-component = { version = "=0.9.0", features = ["tree-sitter-sql"] }

[dev-dependencies]
bookie-app-services = { path = "../../crates/app-services", features = ["test-support"] }
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "ring", "std", "tls12"] }

[patch.crates-io]
sqlx-core = { path = "../../vendor/sqlx-core" }
sqlx-mysql = { path = "../../vendor/sqlx-mysql" }
sqlx-sqlite = { path = "../../vendor/sqlx-sqlite" }
sqlx-postgres = { path = "../../vendor/sqlx-postgres" }
mongodb = { path = "../../vendor/mongodb" }
redis = { path = "../../vendor/redis" }
tiberius = { path = "../../vendor/tiberius" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
rc_mutex = "deny"
empty_drop = "deny"
lossy_float_literal = "deny"
large_stack_arrays = "deny"
