[package]
name = "bookie-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "bookie_app"
path = "src/lib.rs"

[[bin]]
name = "bookie-app"
path = "src/main.rs"

[features]
default = ["kerberos"]
kerberos = ["bookie-driver-mssql/kerberos"]

[dependencies]
bookie-app-services = { path = "../../../crates/app-services" }
bookie-core = { path = "../../../crates/core" }
bookie-policy = { path = "../../../crates/policy" }
bookie-mcp = { path = "../../../crates/mcp" }
bookie-driver-clickhouse = { path = "../../../crates/drivers/clickhouse" }
bookie-driver-duckdb = { path = "../../../crates/drivers/duckdb" }
bookie-driver-mongodb = { path = "../../../crates/drivers/mongodb" }
bookie-driver-mssql = { path = "../../../crates/drivers/mssql" }
bookie-driver-mysql = { path = "../../../crates/drivers/mysql" }
bookie-driver-oracle = { path = "../../../crates/drivers/oracle" }
bookie-driver-postgres = { path = "../../../crates/drivers/postgres" }
bookie-driver-redis = { path = "../../../crates/drivers/redis" }
bookie-driver-sqlite = { path = "../../../crates/drivers/sqlite" }
chrono.workspace = true
rust_decimal.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
bookie-ssh = { path = "../../../crates/ssh" }
bookie-storage = { path = "../../../crates/storage" }
bookie-transport = { path = "../../../crates/transport" }
gtk4.workspace = true
libadwaita.workspace = true
sourceview5.workspace = true
glib.workspace = true
relm4.workspace = true
secrecy.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
gettext-rs = { version = "0.8", features = ["gettext-system"] }
libc = "0.2"
whoami = "2"
async-trait.workspace = true

[dev-dependencies]
futures.workspace = true
serde.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
bookie-app-services = { path = "../../../crates/app-services", features = ["test-support"] }
testcontainers = { workspace = true, features = ["http_wait_plain"] }
testcontainers-modules = { workspace = true, features = ["mongo", "mysql", "postgres", "mssql_server", "redis"] }
mongodb = { version = "3.8", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
zip = { version = "9.1", default-features = false, features = ["deflate"] }
sha2.workspace = true

[build-dependencies]
glib-build-tools.workspace = true

[lints]
workspace = true
