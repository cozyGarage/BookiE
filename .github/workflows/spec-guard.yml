name: spec-guard

# Advisory only. Forgejo merge tiers are unchanged. Drift is reported; the job
# must not fail a pull request. Promote to a gate only after alignment item A-9.
on:
  push:
    branches: [linux, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: spec-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Self-verify (warn only)
        run: node scripts/self-verify.mjs --warn --profile core
      - name: Spec structure (warn only)
        run: node scripts/spec-structure.mjs
        continue-on-error: true
      - name: Adoption gates (warn only)
        run: node scripts/adoption-gates.mjs
        continue-on-error: true
