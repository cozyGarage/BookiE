name: Release

on:
  push:
    tags: ["linux-v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "meson.build"
      - "apps/linux/flatpak/com.bookie.linux.metainfo.xml"
      - "scripts/check-release-version.py"
      - "scripts/tests/test_release_version.py"
      - "scripts/build-appimage.sh"
      - "scripts/build-deb.sh"
      - "apps/gpui/Cargo.toml"
      - "apps/gpui/Cargo.lock"
      - "docs/decisions/0052-gpui-is-the-cross-platform-frontend.md"
      - "docs/platforms.md"
      - "changelog.d/gpui-linux-preview.added.md"
      - "scripts/tests/test_release_publication.py"
      - "scripts/validate-release-recovery.py"
      - "scripts/validate_release_inputs.py"
      - "scripts/tests/test_release_inputs.py"
      - "scripts/validate-deb-package.sh"
      - "scripts/release-notes.py"
      - "scripts/update-aur-recipe.py"
      - "scripts/tests/test_update_aur_recipe.py"
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Existing tag run whose release asset builds passed; leave empty to build assets
        type: string
        default: ""
      release_tag:
        description: Existing linux-vX.Y.Z tag for publication recovery
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive

jobs:
  prepare:
    name: Verify version and notes
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      artifact_run: ${{ steps.version.outputs.artifact_run }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Record how long this run waited in the queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          created="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .created_at)"
          echo "Queue wait before start: $(( $(date +%s) - $(date -d "$created" +%s) )) seconds since $created" | tee -a "$GITHUB_STEP_SUMMARY"
      - id: version
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          ARTIFACT_RUN: ${{ inputs.artifact_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 scripts/check-release-version.py --print)"
          python3 scripts/check-release-version.py
          publish=false
          tag="${REF#refs/tags/}"
          if [[ -n "$ARTIFACT_RUN" || -n "$RELEASE_TAG" ]]; then
            [[ "$EVENT" == workflow_dispatch && "$RELEASE_TAG" == "linux-v${version}" && -n "$ARTIFACT_RUN" ]] || exit 1
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            python3 scripts/validate-release-recovery.py "$ARTIFACT_RUN" "$RELEASE_TAG" "$(git rev-parse "$RELEASE_TAG^{commit}")"
            tag="$RELEASE_TAG"
            publish=true
          fi
          if [[ "$EVENT" == push && "$REF" == refs/tags/linux-v* ]]; then
            [[ "$REF" == "refs/tags/linux-v${version}" ]] || { echo "tag $REF does not match source version $version" >&2; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tagged commit $GITHUB_SHA is not on main" >&2; exit 1; }
            python3 scripts/release-notes.py notes "$version" > release-notes.md
            cat >> release-notes.md <<'EOF'

          ### Linux frontend assets

          - GTK frontend: Arch package and AppImage.
          - GPUI frontend: unsupported Linux x86_64 preview tarball; glibc 2.39 or newer; accessibility is unverified.
          EOF
            publish=true
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "artifact_run=$ARTIFACT_RUN"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Generate the translation template
        if: steps.version.outputs.publish == 'true' && inputs.artifact_run_id == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext
          python3 scripts/update-translations.py --output-dir translations
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: steps.version.outputs.publish == 'true' && inputs.artifact_run_id == ''
        with:
          name: release-notes
          path: |
            release-notes.md
            translations/bookie.pot

  appimage:
    name: AppImage
    if: inputs.artifact_run_id == ''
    needs: [prepare, arch]
    runs-on: ubuntu-24.04
    container: debian:testing
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git nodejs pkg-config \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libssl-dev libsecret-1-dev libkrb5-dev \
            libsqlite3-dev clang python3 dpkg-dev file patchelf desktop-file-utils squashfs-tools xz-utils \
            gettext binutils libgdk-pixbuf-2.0-dev librsvg2-common shared-mime-info ibus-gtk4
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-inputs
          path: ${{ runner.temp }}/bookie-release-inputs
      # Only the pull request dry run reuses a cache. A tag or dispatch build that publishes starts clean, so
      # no earlier cache can reach a released package.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # zizmor: ignore[cache-poisoning]
        if: github.event_name == 'pull_request'
        with:
          prefix-key: release-appimage
      - name: Build
        env:
          APPIMAGE_OUT: ${{ runner.temp }}/bookie-appimage-output-sentinel
          BOOKIE_RELEASE_INPUTS_DIR: ${{ runner.temp }}/bookie-release-inputs
          BOOKIE_RELEASE_COMMIT: ${{ github.sha }}
          BOOKIE_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p "$APPIMAGE_OUT"
          touch "$APPIMAGE_OUT/preserve"
          scripts/build-appimage.sh
          test -f "$APPIMAGE_OUT/preserve"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: package-appimage
          path: |
            target/appimage/*.AppImage
            target/appimage/*.AppImage.sha256

  arch:
    name: Arch package
    if: inputs.artifact_run_id == ''
    needs: prepare
    runs-on: ubuntu-24.04
    # Rolling by design: the Arch package must build against current Arch libraries.
    container: archlinux:latest # zizmor: ignore[unpinned-images]
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust pkgconf clang gettext sudo nodejs \
            gtk4 libadwaita gtksourceview5 libsecret krb5 sqlite openssl desktop-file-utils appstream namcap
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Build and validate
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          chown -R builder .
          sudo -u builder bash -ceu '
            git config --global --add safe.directory "$PWD"
            export BOOKIE_RC_COMMIT="$(git rev-parse HEAD)" BOOKIE_RC_VERSION="'"$VERSION"'"
            export BOOKIE_RC_DATE="$(date -u +%F)" BOOKIE_RC_PKGREL=1
            bash scripts/build-arch-rc.sh
            cd apps/linux/packaging/arch
            for package in bookie-'"$VERSION"'-*.pkg.tar.zst; do sha256sum "$package" > "$package.sha256"; done
          '
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: package-arch
          path: |
            apps/linux/packaging/arch/bookie-*.pkg.tar.zst
            apps/linux/packaging/arch/bookie-*.pkg.tar.zst.sha256
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: release-inputs
          path: target/arch-release-inputs/bookie-*
          if-no-files-found: error
          retention-days: 1

  gpui-linux:
    name: GPUI Linux preview
    if: inputs.artifact_run_id == ''
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98"
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libvulkan-dev
      - name: Check release toolchain floor
        run: |
          glibc="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"
          dpkg --compare-versions "$glibc" ge 2.39 || { echo "Ubuntu 24.04 build requires glibc 2.39; found $glibc" >&2; exit 1; }
          echo "GPUI Linux preview runtime floor: glibc 2.39 or newer" >> "$GITHUB_STEP_SUMMARY"
      - name: Build GPUI
        run: cargo build --release --locked --manifest-path apps/gpui/Cargo.toml
      - name: Package GPUI preview
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          name="bookie-gpui-linux-x86_64-${VERSION}"
          mkdir -p "dist/${name}"
          install -m 0755 apps/gpui/target/release/bookie-gpui "dist/${name}/bookie-gpui"
          printf '%s\n' "$VERSION" > "dist/${name}/VERSION"
          git rev-parse HEAD > "dist/${name}/SOURCE_COMMIT"
          cat > "dist/${name}/INSTALL.txt" <<'EOF'
          Unsupported BookiE GPUI Linux x86_64 preview.

          Extract this archive, change into the extracted directory, and run ./bookie-gpui from a graphical X11 or Wayland session.
          Requires glibc 2.39 or newer, a Vulkan-capable graphics driver, and the host runtime
          libraries: fontconfig, freetype, Wayland client, xkbcommon and Vulkan loader.
          This preview is read-only. Keyboard and screen-reader accessibility are unverified;
          this artifact does not claim supported Linux platform status.
          EOF
          ldd "dist/${name}/bookie-gpui" > "dist/${name}/RUNTIME_DEPENDENCIES.txt"
          if grep -q 'not found' "dist/${name}/RUNTIME_DEPENDENCIES.txt"; then
            cat "dist/${name}/RUNTIME_DEPENDENCIES.txt" >&2
            exit 1
          fi
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          echo "GPUI Linux preview: ${name}.tar.gz (glibc 2.39+)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: package-gpui-linux
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  aur-recipe:
    name: AUR recipe
    if: >-
      github.event_name == 'push' && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true'
    needs: [prepare]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Point the recipe at this tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir aur-recipe
          python3 scripts/update-aur-recipe.py "$TAG" --output aur-recipe/PKGBUILD
          bash -n aur-recipe/PKGBUILD
          cat aur-recipe/PKGBUILD
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: aur-recipe
          path: aur-recipe/PKGBUILD
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    if: >-
      always() && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true' &&
      (needs.prepare.outputs.artifact_run != '' ||
       (needs.appimage.result == 'success' && needs.arch.result == 'success' && needs.gpui-linux.result == 'success'))
    needs: [prepare, appimage, arch, gpui-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: artifacts
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.artifact_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Collect release files
        run: |
          mkdir release
          cd artifacts
          cp -- *.AppImage *.pkg.tar.zst \
            bookie-gpui-linux-x86_64-*.tar.gz \
            bookie-gpui-linux-x86_64-*.tar.gz.sha256 \
            translations/bookie.pot ../release/
          cp release-notes.md ../release-notes.md
          cd ../release
          sha256sum -- * > SHA256SUMS
          ls -l
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: release/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          flags=(--draft --verify-tag --title "BookiE $VERSION" --notes-file release-notes.md)
          [[ "$VERSION" == 0.* ]] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" release/* --repo "$GITHUB_REPOSITORY"
