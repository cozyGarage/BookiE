name: Linux CI contracts

on:
  push:
    branches: [linux, main]
    paths: [".github/workflows/**", "linux/scripts/**", "linux/packaging/**"]
  pull_request:
    branches: [linux, main]
    paths: [".github/workflows/**", "linux/scripts/**", "linux/packaging/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Install pinned workflow validator
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate Linux workflows and embedded shell
        run: |
          actionlint_bin="$(go env GOPATH)/bin"
          export PATH="$actionlint_bin:$PATH"
          python3 linux/scripts/run-test-layer.py workflow-lint
      - name: Retain workflow diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workflow-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: linux/target/quality/*-layers
          if-no-files-found: error
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Test runner failures and workflow contracts
        run: python3 linux/scripts/run-test-layer.py harness packaging-contracts
      - name: Retain evidence even after failure
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ci-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: linux/target/quality/*-layers
          if-no-files-found: error
