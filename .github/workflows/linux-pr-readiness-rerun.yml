name: Linux PR readiness rerun

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] This workflow uses trusted branch code and reads CI metadata only; it never downloads artifacts or executes pull request code.
    workflows:
      - Build Linux
      - Flatpak Linux (packaging only)
      - Linux Security
      - Linux CI contracts
      - PR title
      - Release note
    types: [completed]

permissions: {}

jobs:
  recheck:
    name: Publish readiness for the rerun PR head
    if: github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      checks: write
      contents: read
      pull-requests: read
    concurrency:
      group: linux-pr-readiness-rerun-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Re-evaluate required checks on the exact pull request head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          READINESS_RECHECK: "true"
          READINESS_CHECK_EXTERNAL_ID: ${{ github.event.workflow_run.id }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/check-pr-readiness.py
