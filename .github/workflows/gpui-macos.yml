name: GPUI macOS build

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/**"
      - "vendor/**"
      - "apps/gpui/**"
      - ".github/workflows/gpui-macos.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/**"
      - "vendor/**"
      - "apps/gpui/**"
      - ".github/workflows/gpui-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: GPUI build and tests (macOS 15 arm64)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/gpui
          prefix-key: gpui-macos
      - name: Record macOS build environment
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          rustc --version
          cargo --version
          {
            echo "### GPUI macOS build environment"
            echo
            echo "- Runner: macOS 15 arm64"
            echo "- Rust: $(rustc --version)"
            echo "- Native graphics: Apple Metal via Xcode command line tools"
            echo "- Scope: compile and headless tests only; no package or platform support claim"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the GPUI application
        run: cargo build --manifest-path apps/gpui/Cargo.toml --locked
      - name: Run GPUI tests
        run: cargo test --manifest-path apps/gpui/Cargo.toml --locked
