name: GPUI macOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect GPUI changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gpui: ${{ steps.filter.outputs.gpui }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check for GPUI-relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          relevant=true
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")"
            pattern='^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.cargo/|crates/|vendor/|apps/gpui/|\.github/workflows/gpui-macos\.yml$)'
            if ! grep -Eq "$pattern" <<<"$changed"; then
              relevant=false
            fi
          fi
          echo "GPUI-relevant changes: $relevant"
          echo "gpui=$relevant" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: GPUI lint, build and tests (macOS 15 arm64)
    needs: changes
    if: needs.changes.outputs.gpui == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: apps/gpui/target
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/gpui
          prefix-key: gpui-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: Record macOS build environment
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          rustc --version
          cargo --version
          {
            echo "### GPUI macOS build environment"
            echo
            echo "- Runner: macOS 15 arm64"
            echo "- Rust: $(rustc --version)"
            echo "- Native graphics: Apple Metal via Xcode command line tools"
            echo "- Scope: compile and headless tests only; no package or platform support claim"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lint the GPUI application
        run: cargo clippy --manifest-path apps/gpui/Cargo.toml --all-targets --locked
      - name: Build the GPUI application
        run: cargo build --manifest-path apps/gpui/Cargo.toml --locked
      - name: Run GPUI tests
        run: cargo nextest run --manifest-path apps/gpui/Cargo.toml --locked --profile ci
      - name: Upload GPUI test report
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: gpui-macos-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/gpui/target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7

  result:
    name: GPUI macOS
    needs: [changes, build-and-test]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check GPUI macOS result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          GPUI_CHANGED: ${{ needs.changes.outputs.gpui }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::GPUI change detection did not pass (result: $CHANGES_RESULT)."
            exit 1
          fi
          if [ "$BUILD_RESULT" = "success" ]; then
            exit 0
          fi
          if [ "$BUILD_RESULT" = "skipped" ] && [ "$GPUI_CHANGED" = "false" ]; then
            echo "No GPUI-relevant changes; macOS build skipped."
            exit 0
          fi
          echo "::error::GPUI macOS build did not pass (result: $BUILD_RESULT)."
          exit 1
