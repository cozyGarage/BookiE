name: GPUI macOS build

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/**"
      - "vendor/**"
      - "apps/gpui/**"
      - ".github/workflows/gpui-macos.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/**"
      - "vendor/**"
      - "apps/gpui/**"
      - ".github/workflows/gpui-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: GPUI build and tests (macOS 15 arm64)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: apps/gpui/target
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/gpui
          prefix-key: gpui-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: Record macOS build environment
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          rustc --version
          cargo --version
          {
            echo "### GPUI macOS build environment"
            echo
            echo "- Runner: macOS 15 arm64"
            echo "- Rust: $(rustc --version)"
            echo "- Native graphics: Apple Metal via Xcode command line tools"
            echo "- Scope: compile and headless tests only; no package or platform support claim"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the GPUI application
        run: cargo build --manifest-path apps/gpui/Cargo.toml --locked
      - name: Run GPUI tests
        run: cargo nextest run --manifest-path apps/gpui/Cargo.toml --locked --profile ci
      - name: Upload GPUI test report
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: gpui-macos-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/gpui/target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: GPUI lint (macOS 15 arm64)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: apps/gpui/target
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/gpui
          prefix-key: gpui-macos-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint the GPUI application
        run: cargo clippy --manifest-path apps/gpui/Cargo.toml --all-targets --locked
