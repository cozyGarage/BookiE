    needs: [pin-revision, ensure-ci-gtk-image, guards]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      BOOKIE_BUILD_PROFILE: dist
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: linux-app-dist
      - name: Install package validation tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends desktop-file-utils
      - name: Build the Linux application binaries once
        env:
          DEB_OUT: ${{ github.workspace }}/.floor-package
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build-deb.sh
          python3 scripts/ci-gtk-artifact.py create --profile dist target/dist/bookie-app target/gtk-safety "$BOOKIE_SOURCE_COMMIT"
          package=$(find "$DEB_OUT" -maxdepth 1 -name '*.deb' -print -quit)
          python3 scripts/ci-gtk-artifact.py create --package "$package" floor-artifact "$BOOKIE_SOURCE_COMMIT"
      - name: Upload the source-pinned GTK binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: gtk-safety-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/gtk-safety/
          if-no-files-found: error
          retention-days: 1
      - name: Upload the source-pinned Debian package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: floor-package-${{ github.run_id }}-${{ github.run_attempt }}
