name: Build Linux

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - ".github/workflows/build-linux.yml"
      - ".github/actions/dockerhub-login/**"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - ".github/workflows/build-linux.yml"
      - ".github/actions/dockerhub-login/**"
  schedule:
    - cron: "13 14 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Commit SHA, tag or branch to build. Pin a release candidate so
          every job in the run tests the same tree.
        required: false
        default: ""

permissions:
  contents: read
  packages: read

# A newer pull request push supersedes its in-flight run. Pull requests and
# Default-branch pushes run the full required regression jobs. Current-stable
# Clippy stays schedule or dispatch only. Scheduled and dispatched runs keep
# their own concurrency group so a manual full Build Linux is never cancelled
# by ordinary branch traffic.
concurrency:
  group: build-linux-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref || 'auto' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pin-revision:
    name: Pin tested revision
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.pin.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || (github.event_name == 'schedule' && 'main') || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Pin the tested revision once
        id: pin
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          echo "tree under test: $revision"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$REQUESTED_REF" ]]; then
            case "$REQUESTED_REF" in
              refs/pull/*|pull/*)
                echo "workflow_dispatch cannot pin a pull request ref" >&2
                exit 1
                ;;
            esac
            git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
            if ! git branch -r --contains "$revision" | grep -qE 'origin/' \
              && ! git tag --contains "$revision" | grep -q .; then
              echo "pinned revision must be on an origin branch or tag" >&2
              exit 1
            fi
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  ensure-ci-gtk-image:
    name: Ensure CI debian-testing GTK image
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: pin-revision
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull or build and push
        id: publish
        env:
          IMAGE: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk
        run: |
          set -euo pipefail
          hash="$(sha256sum ci/debian-testing-gtk/Dockerfile | cut -c1-16)"
          tag="df-${hash}"
          tag_hash="${IMAGE}:${tag}"
          tag_latest="${IMAGE}:latest"
          if ! docker pull "$tag_hash"; then
            docker build --pull \
              -t "$tag_hash" \
              -t "$tag_latest" \
              -f ci/debian-testing-gtk/Dockerfile \
              ci/debian-testing-gtk
            docker push "$tag_hash"
            docker push "$tag_latest"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  preflight:
    name: Preflight and sandbox tier (no GTK app)
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, reusable-test-builds]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
          components: rustfmt, clippy
      - name: Fetch locked dependency manifests for notice generation
        run: |
          cargo fetch --locked --manifest-path apps/linux/app/Cargo.toml
          cargo fetch --locked --manifest-path crates/agentd/Cargo.toml
          cargo fetch --locked --manifest-path crates/ssh/Cargo.toml
      - name: Shared sccache
        if: github.event_name != 'workflow_dispatch' || inputs.ref == ''
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
      - name: Enable sccache for Rust
        if: github.event_name != 'workflow_dispatch' || inputs.ref == ''
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: linux-build
          save-if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-unit
          path: ${{ runner.temp }}/bookie-unit-bundle
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-sandbox
          path: ${{ runner.temp }}/bookie-sandbox-bundle
      - name: Verify the unit and sandbox bundles
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$BOOKIE_SOURCE_COMMIT"
          python3 scripts/ci-test-bundle.py verify "$RUNNER_TEMP/bookie-unit-bundle" "$BOOKIE_SOURCE_COMMIT" --expected-group unit
          python3 scripts/ci-test-bundle.py verify "$RUNNER_TEMP/bookie-sandbox-bundle" "$BOOKIE_SOURCE_COMMIT" --expected-group sandbox
          printf 'BOOKIE_UNIT_BUNDLE=%s/bookie-unit-bundle\nBOOKIE_SANDBOX_BUNDLE=%s/bookie-sandbox-bundle\nBOOKIE_REQUIRE_PREBUILT=1\nBOOKIE_SOURCE_COMMIT=%s\nBOOKIE_NEXTEST_PROFILE=ci\nGSETTINGS_SCHEMA_DIR=%s/bookie-unit-bundle/schemas\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$BOOKIE_SOURCE_COMMIT" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Preflight
        run: python3 scripts/run-test-layer.py quick

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  reusable-test-builds:
    name: Reusable test builds
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image]
    timeout-minutes: 60
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      BOOKIE_BUILD_IMAGE: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - name: Build versioned executable test bundles
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build-test-bundles.sh "$GITHUB_WORKSPACE/reusable-builds" all
      - name: Check the no-default-features layer
        run: python3 scripts/run-test-layer.py no-default-features
      - name: Upload source-pinned direct test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-direct
          path: reusable-builds/direct/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned consumer test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-consumers
          path: reusable-builds/consumers/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned driver test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-drivers
          path: reusable-builds/drivers/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned core driver test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-driver-core
          path: reusable-builds/driver-core/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned analytics driver test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-driver-analytics
          path: reusable-builds/driver-analytics/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned extended driver test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-driver-extended
          path: reusable-builds/driver-extended/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned PostgreSQL release test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-pg-release
          path: reusable-builds/pg-release/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned socket and SSH test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-socket-ssh
          path: reusable-builds/socket-ssh/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned TLS test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-driver-tls
          path: reusable-builds/driver-tls/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned keyring test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-keyring
          path: reusable-builds/keyring/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned unit archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-unit
          path: reusable-builds/unit/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned sandbox archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-sandbox
          path: reusable-builds/sandbox/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned GPUI bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-gpui
          path: reusable-builds/gpui/
          if-no-files-found: error
          retention-days: 14

  gpui-tests:
    name: GPUI model and simulated interaction tests
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, reusable-test-builds]
    timeout-minutes: 45
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/gpui-${{ github.run_id }}-${{ github.run_attempt }}
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-gpui
          path: ${{ runner.temp }}/bookie-gpui-bundle
      - name: GPUI model and simulated interaction tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci-test-bundle.py verify "$RUNNER_TEMP/bookie-gpui-bundle" "${{ needs.pin-revision.outputs.revision }}" --expected-group gpui
          workspace_root="$(cd apps/gpui && pwd -P)"
          test -r "$workspace_root/tests/fixtures/orders.sqlite"
          NEXTEST="$(bash scripts/ensure-nextest.sh)"
          mkdir -p "$RUNNER_TEMP/bookie-gpui-extract"
          "$NEXTEST" nextest run --archive-file "$RUNNER_TEMP/bookie-gpui-bundle/nextest.tar.zst" \
            --workspace-remap "$workspace_root" \
            --extract-to "$RUNNER_TEMP/bookie-gpui-extract" --profile default --no-tests=fail
      - name: Finalize runner job
        if: always()
        run: rm -rf -- "$CARGO_TARGET_DIR" "$RUNNER_TEMP/bookie-gpui-extract"

  fast:
    name: Fast checks (GTK)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, reusable-test-builds]
    # The toolkit floor (ADR 0021) requires GTK 4.24, GLib 2.88, libadwaita 1.10 and GtkSourceView 5.22.
    # Pre-baked debian:testing + GTK deps from ci/debian-testing-gtk.
    # The integration job stays on the host runner — driver crates depend
    # only on bookie-core, so they don't pull in libadwaita.
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      env:
        DEBIAN_FRONTEND: noninteractive
        DOCKER_CONFIG: /github/home/.docker
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
          pkg-config --exists 'glib-2.0 >= 2.80'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
          components: rustfmt, clippy
      - name: Fetch locked dependency manifests for notice generation
        run: |
          cargo fetch --locked --manifest-path apps/linux/app/Cargo.toml
          cargo fetch --locked --manifest-path crates/agentd/Cargo.toml
          cargo fetch --locked --manifest-path crates/ssh/Cargo.toml
      - name: Shared sccache
        if: github.event_name != 'workflow_dispatch' || inputs.ref == ''
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
      - name: Enable sccache for Rust
        if: github.event_name != 'workflow_dispatch' || inputs.ref == ''
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: linux-build
          save-if: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-unit
          path: ${{ runner.temp }}/bookie-unit-bundle
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-direct
          path: ${{ runner.temp }}/bookie-direct-bundle
      - name: Verify unit and direct test bundles
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$BOOKIE_SOURCE_COMMIT"
          python3 scripts/ci-test-bundle.py verify "$RUNNER_TEMP/bookie-unit-bundle" "$BOOKIE_SOURCE_COMMIT" --expected-group unit
          python3 scripts/ci-test-bundle.py verify "$RUNNER_TEMP/bookie-direct-bundle" "$BOOKIE_SOURCE_COMMIT" --expected-group direct
          find "$RUNNER_TEMP/bookie-direct-bundle/tests" "$RUNNER_TEMP/bookie-direct-bundle/bin" -type f -exec chmod u+x {} +
          printf 'BOOKIE_UNIT_BUNDLE=%s/bookie-unit-bundle\nBOOKIE_DIRECT_BUNDLE=%s/bookie-direct-bundle\nBOOKIE_REQUIRE_PREBUILT=1\nBOOKIE_SOURCE_COMMIT=%s\nBOOKIE_NEXTEST_PROFILE=ci\nGSETTINGS_SCHEMA_DIR=%s/bookie-unit-bundle/schemas\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$BOOKIE_SOURCE_COMMIT" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Focused tests for changed Data-lane value paths
        env:
          BOOKIE_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          BOOKIE_TEST_BUNDLE: ${{ runner.temp }}/bookie-direct-bundle
        run: python3 scripts/run-test-layer.py change-contracts
      - name: GTK app unit tests (build via test)
        env:
          BOOKIE_TEST_BUNDLE: ${{ runner.temp }}/bookie-unit-bundle
        run: python3 scripts/run-test-layer.py gtk-app
      - name: Isolated GTK widget regressions
        env:
          BOOKIE_TEST_BUNDLE: ${{ runner.temp }}/bookie-direct-bundle
        run: python3 scripts/run-test-layer.py widgets
      - name: Pre-pull app-server fixture images
        run: bash scripts/prepull-test-images.sh app-server
      - name: App numeric parser against PostgreSQL
        env:
          BOOKIE_TEST_BUNDLE: ${{ runner.temp }}/bookie-direct-bundle
        run: python3 scripts/run-test-layer.py app-server
      - name: Build GTK safety binary
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
        run: |
          cargo build --profile ci --locked -p bookie-app --bin bookie-app
          python3 scripts/ci-gtk-artifact.py create target/ci/bookie-app target/gtk-safety "$BOOKIE_SOURCE_COMMIT"
      - name: Upload GTK safety binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: gtk-safety-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/gtk-safety/
          if-no-files-found: error
          retention-days: 1

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/quality/*-layers
            target/quality/*-change-contracts
          if-no-files-found: error

  gtk-safety:
    name: Installed GTK safety smoke
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, fast]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        working-directory: .
    steps:
      - name: Install Git before checkout
        working-directory: /tmp
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gtk-safety-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/gtk-safety
      - name: Verify the source-pinned GTK binary and schemas
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
        run: |
          binary=$(python3 scripts/ci-gtk-artifact.py verify target/gtk-safety "$BOOKIE_SOURCE_COMMIT")
          printf 'BOOKIE_GTK_BINARY=%s\nGSETTINGS_SCHEMA_DIR=%s/target/gtk-safety/schemas\n' \
            "$binary" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Install GTK test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends scrot
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - name: Secret Service round-trip
        run: python3 scripts/run-test-layer.py keyring
      - name: GTK installed-flow smoke
        env:
          BOOKIE_GTK_ARTIFACT_DIR: ${{ github.workspace }}/gtk-artifacts/smoke
        run: python3 scripts/run-test-layer.py ui
      - name: Upload GTK diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: gtk-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: gtk-artifacts
          if-no-files-found: error

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-gtk-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  gtk-server:
    name: Installed GTK server scenarios (${{ matrix.server }})
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, fast]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      env:
        DEBIAN_FRONTEND: noninteractive
        DOCKER_CONFIG: /github/home/.docker
    defaults:
      run:
        working-directory: .
    env:
      BOOKIE_GTK_SCENARIO_RETRIES: "0"
      BOOKIE_TEST_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-gtk-server-${{ matrix.server }}
    strategy:
      fail-fast: false
      matrix:
        server: [clickhouse, mongodb, postgres, mysql]
    steps:
      - name: Install Git before checkout
        working-directory: /tmp
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gtk-safety-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/gtk-safety
      - name: Verify the source-pinned GTK binary and schemas
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
        run: |
          binary=$(python3 scripts/ci-gtk-artifact.py verify target/gtk-safety "$BOOKIE_SOURCE_COMMIT")
          printf 'BOOKIE_GTK_BINARY=%s\nGSETTINGS_SCHEMA_DIR=%s/target/gtk-safety/schemas\n' \
            "$binary" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Installed GTK scenarios against ${{ matrix.server }}
        run: python3 scripts/run-test-layer.py "gtk-${{ matrix.server }}"
      - name: Clean fixture containers
        if: always()
        run: |
          if [[ -f scripts/cleanup-testcontainers.py ]]; then
            python3 scripts/cleanup-testcontainers.py "$BOOKIE_TEST_RUN_ID"
          fi
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-gtk-server-${{ matrix.server }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  current-stable-clippy:
    name: Current stable Clippy (scheduled)
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: pin-revision
    container:
      image: debian:testing
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        working-directory: .
    steps:
      - name: Install Git before checkout
        working-directory: /tmp
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            libssl-dev \
            libsecret-1-dev \
            libkrb5-dev \
            libsqlite3-dev \
            clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-current-stable-clippy
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: Clippy on current stable
        # The repository override selects 1.98, so +stable is required here.
        run: cargo +stable clippy --workspace --all-targets -- -D warnings

  integration:
    name: Driver integration tests (docker)
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    needs: [pin-revision, b4-rollback, ensure-ci-gtk-image, reusable-test-builds]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-drivers
          path: ${{ runner.temp }}/bookie-drivers-bundle
      - name: Verify the test bundle
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$BOOKIE_SOURCE_COMMIT"
          python3 scripts/ci-test-bundle.py verify "$RUNNER_TEMP/bookie-drivers-bundle" "$BOOKIE_SOURCE_COMMIT" --expected-group drivers
          find "$RUNNER_TEMP/bookie-drivers-bundle/tests" "$RUNNER_TEMP/bookie-drivers-bundle/bin" -type f -exec chmod u+x {} +
      - name: Driver, socket and SSH integration
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
          BOOKIE_BUILD_IMAGE: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
        run: |
          task_tmp="$(mktemp -d /tmp/bookie-ci.XXXXXX)"
          trap 'rm -rf -- "$task_tmp"' EXIT
          docker run --rm --entrypoint cat "$BOOKIE_BUILD_IMAGE" /etc/passwd > "$RUNNER_TEMP/bookie-integration-passwd"
          printf 'bookie-ci:x:%s:%s:CI:%s:/usr/sbin/nologin\n' "$(id -u)" "$(id -g)" "$task_tmp" >> "$RUNNER_TEMP/bookie-integration-passwd"
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --volume "$RUNNER_TEMP/bookie-integration-passwd:/etc/passwd:ro" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --volume "$task_tmp:$task_tmp" \
            --volume "$HOME/.docker:/docker:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            --env HOME="$task_tmp" --env TMPDIR="$task_tmp" \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            --env DOCKER_CONFIG=/docker --env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --env BOOKIE_TEST_BUNDLE="$RUNNER_TEMP/bookie-drivers-bundle" \
            --env BOOKIE_REQUIRE_PREBUILT=1 --env BOOKIE_SOURCE_COMMIT="$BOOKIE_SOURCE_COMMIT" \
            "$BOOKIE_BUILD_IMAGE" bash -euo pipefail -c 'python3 scripts/run-test-layer.py drivers && python3 scripts/run-test-layer.py pg-dump'

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  b4-rollback:
    name: Policy rollback acceptance (docker)
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: pin-revision
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libkrb5-dev \
            clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-integration
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: Verify docker is available
        run: docker version
      - name: Focused MySQL and PostgreSQL rollback cases
        run: python3 scripts/run-test-layer.py b4-rollback

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-b4-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  driver-tls:
    name: Driver TLS fixture (docker)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: pin-revision
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libkrb5-dev \
            clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-driver-tls
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: Verify docker is available
        run: docker compose version
      - name: Driver TLS fixture
        run: python3 scripts/run-test-layer.py tls

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-driver-tls-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  postgres-release:
    name: PostgreSQL release fixture (docker)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      BOOKIE_BUILD_IMAGE: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-postgres-release
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: PostgreSQL release and GTK acceptance on the supported toolkit floor
        env:
          BOOKIE_GTK_BINARY: target/installed/usr/bin/bookie
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
        run: |
          set -euo pipefail
          toolchain_bin="$(dirname "$(rustup which cargo --toolchain 1.98)")"
          toolchain_relative="${toolchain_bin#"$HOME/.rustup"}"
          if [[ "$toolchain_relative" == "$toolchain_bin" ]]; then
            echo "Rust toolchain is outside the mounted Rustup home" >&2
            exit 1
          fi
          docker run --rm --entrypoint cat "$BOOKIE_BUILD_IMAGE" /etc/passwd > "$RUNNER_TEMP/bookie-ci-passwd"
          printf 'bookie-ci:x:%s:%s:CI:/tmp:/usr/sbin/nologin\n' "$(id -u)" "$(id -g)" >> "$RUNNER_TEMP/bookie-ci-passwd"
          docker run --rm \
            --network host \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --volume "$RUNNER_TEMP/bookie-ci-passwd:/etc/passwd:ro" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$HOME/.cargo:/cargo" \
            --volume "$HOME/.rustup:/rustup:ro" \
            --volume "$HOME/.docker:/docker" \
            --workdir "$GITHUB_WORKSPACE" \
            --env HOME=/tmp \
            --env CARGO_HOME=/cargo \
            --env RUSTUP_HOME=/rustup \
            --env CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            --env CARGO_BUILD_JOBS=4 \
            --env PATH="/rustup${toolchain_relative}:/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            --env DOCKER_CONFIG=/docker \
            --env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --env BOOKIE_GTK_BINARY="$BOOKIE_GTK_BINARY" \
            --env BOOKIE_SOURCE_COMMIT="$BOOKIE_SOURCE_COMMIT" \
            --env GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            "$BOOKIE_BUILD_IMAGE" \
            bash -euo pipefail -c '
              git config --global --add safe.directory "$GITHUB_WORKSPACE"
              echo "tree under test: $(git rev-parse HEAD)"
              cargo --version
              rustc --version
              pkg-config --modversion gtk4 glib-2.0 libadwaita-1 gtksourceview-5
              pkg-config --atleast-version=4.24 gtk4
              pkg-config --atleast-version=2.88 glib-2.0
              pkg-config --atleast-version=1.10 libadwaita-1
              pkg-config --atleast-version=5.22 gtksourceview-5
              docker compose version
              docker info --format "{{.ServerVersion}}"
              cargo build --locked --release -p bookie-app
              install -Dm755 target/release/bookie-app "$BOOKIE_GTK_BINARY"
              python3 scripts/run-test-layer.py postgres-release
              python3 scripts/run-test-layer.py gtk-mysql-approval
              if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
                cargo build --locked --release -p bookie-agentd -p bookie-ssh --bin bookie-askpass
                DEB_OUT="$GITHUB_WORKSPACE/floor-package" BOOKIE_BUILD_PROFILE=release DEB_SKIP_BUILD=1 \
                  bash scripts/build-deb.sh
                package=$(find "$GITHUB_WORKSPACE/floor-package" -maxdepth 1 -name '*.deb' -print -quit)
                python3 scripts/ci-gtk-artifact.py create --package "$package" \
                  "$GITHUB_WORKSPACE/floor-artifact" "$BOOKIE_SOURCE_COMMIT"
              fi
            '

      - name: Upload the Debian package for distro-floor scenarios
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: floor-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: floor-artifact/
          if-no-files-found: error
          retention-days: 2

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-postgres-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  distro-floor-scenarios:
    name: Debian testing package GTK scenarios (${{ matrix.shard_group }})
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, postgres-release]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      env:
        DEBIAN_FRONTEND: noninteractive
        DOCKER_CONFIG: /github/home/.docker
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard_group: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: floor-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: floor-artifact/
      - name: Verify the package under test
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
        run: |
          package=$(python3 scripts/ci-gtk-artifact.py verify --package floor-artifact "$BOOKIE_SOURCE_COMMIT")
          printf 'DISTRO_FLOOR_PACKAGE=%s\n' "$package" >> "$GITHUB_ENV"
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pre-pull the Debian testing image
        run: bash scripts/prepull-test-images.sh distro-floor
      - name: Run distro-floor scenario shards
        env:
          SHARD_GROUP: ${{ matrix.shard_group }}
        run: |
          for shard in "$SHARD_GROUP" "$((SHARD_GROUP + 2))" "$((SHARD_GROUP + 4))"; do
            python3 scripts/ci-mcp-port.py "$((10 + shard))"
            BOOKIE_GTK_SHARD="${shard}/6" python3 scripts/run-test-layer.py distro-floor
          done
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-distro-floor-${{ matrix.shard_group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  regression-gate:
    name: Linux regression gate
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    needs:
      - pin-revision
      - reusable-test-builds
      - gpui-tests
      - preflight
      - fast
      - gtk-safety
      - gtk-server
      - integration
      - b4-rollback
      - driver-tls
      - postgres-release
      - distro-floor-scenarios
      - current-stable-clippy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Require every regression job
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-jobs.py
