    needs: [pin-revision, ensure-ci-gtk-image, guards, clippy, test-build]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      env:
        DEBIAN_FRONTEND: noninteractive
        DOCKER_CONFIG: /github/home/.docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-pg-release
          path: ${{ runner.temp }}/bookie-pg-release-bundle
      - name: Verify the source-pinned PostgreSQL release bundle
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
          BOOKIE_TEST_BUNDLE: ${{ runner.temp }}/bookie-pg-release-bundle
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci-test-bundle.py verify "$BOOKIE_TEST_BUNDLE" "$BOOKIE_SOURCE_COMMIT" --expected-group pg-release
          find "$BOOKIE_TEST_BUNDLE" -type f \( -path "$BOOKIE_TEST_BUNDLE/tests/*" -o -path "$BOOKIE_TEST_BUNDLE/bin/*" \) -exec chmod u+x {} +
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pre-pull PostgreSQL release fixture images
        run: bash scripts/prepull-test-images.sh pg-release
      - name: Select isolated MCP HTTP port
        run: python3 scripts/ci-mcp-port.py 4
      - name: PostgreSQL release fixture
        env:
          BOOKIE_TEST_BUNDLE: ${{ runner.temp }}/bookie-pg-release-bundle
          BOOKIE_REQUIRE_PREBUILT: "1"
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
          BOOKIE_TOOL_DIR: /var/cache/ci/tools
          CARGO_TARGET_DIR: ${{ runner.temp }}/bookie-pg-release-target
          TMPDIR: ${{ runner.temp }}/bookie-pg-release-tmp
        run: |
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR"
          python3 scripts/run-test-layer.py postgres-release
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-pg-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  distro-floor-scenarios:
    name: Debian testing package GTK scenarios (${{ matrix.shard_group }})
    if: github.event_name != 'push'
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, linux-build]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      env:
        DEBIAN_FRONTEND: noninteractive
        DOCKER_CONFIG: /github/home/.docker
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard_group: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: floor-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: floor-artifact/
      - name: Verify the package under test
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
        run: |
          package=$(python3 scripts/ci-gtk-artifact.py verify --package floor-artifact "$BOOKIE_SOURCE_COMMIT")
          printf 'DISTRO_FLOOR_PACKAGE=%s\n' "$package" >> "$GITHUB_ENV"
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pre-pull the Debian testing image
        run: bash scripts/prepull-test-images.sh distro-floor
      - name: Run distro-floor scenario shards
        env:
          SHARD_GROUP: ${{ matrix.shard_group }}
        run: |
          for shard in "$SHARD_GROUP" "$((SHARD_GROUP + 2))" "$((SHARD_GROUP + 4))"; do
            python3 scripts/ci-mcp-port.py "$((10 + shard))"
            BOOKIE_GTK_SHARD="${shard}/6" python3 scripts/run-test-layer.py distro-floor
          done
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-distro-floor-${{ matrix.shard_group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error


  security-policy:
    if: github.event_name != 'push'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, test-build]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-consumers
          path: ${{ runner.temp }}/bookie-security-policy-bundle
      - name: Verify the source-pinned security bundle
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
          BOOKIE_TEST_BUNDLE: ${{ runner.temp }}/bookie-security-policy-bundle
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci-test-bundle.py verify "$BOOKIE_TEST_BUNDLE" "$BOOKIE_SOURCE_COMMIT" --expected-group consumers
          find "$BOOKIE_TEST_BUNDLE" -type f \( -path "$BOOKIE_TEST_BUNDLE/tests/*" -o -path "$BOOKIE_TEST_BUNDLE/bin/*" \) -exec chmod u+x {} +
      - name: Security policy tests
        env:
          BOOKIE_TEST_BUNDLE: ${{ runner.temp }}/bookie-security-policy-bundle
          BOOKIE_REQUIRE_PREBUILT: "1"
        run: python3 scripts/run-test-layer.py security-policy

  supply-chain:
    if: github.event_name != 'push'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, guards, clippy]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: linux-supply-chain
      - name: Install supply-chain tools
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-shear --version 1.13.4
      - name: Dependency, vendor and license checks
        run: |
          python3 scripts/run-test-layer.py supply-chain unused-dependencies
          python3 scripts/vendor-patches.py check

  regression-gate:
    name: Linux regression gate
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - pin-revision
      - test-build
      - gpui-build
      - guards
      - clippy
      - unit
      - sandbox
      - gpui-tests
      - widgets
      - consumers
      - linux-build
      - gtk
      - keyring
      - gtk-server
      - driver
      - b4-rollback
      - driver-tls
      - pg-release
      - security-policy
      - supply-chain
      - distro-floor-scenarios
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Require every regression job
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-jobs.py
