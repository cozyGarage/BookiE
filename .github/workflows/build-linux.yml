name: Build Linux

on:
  push:
    branches: [main, linux]
    paths:
      - "linux/**"
      - "!linux/docs/**"
      - "!**.md"
      - ".github/workflows/build-linux.yml"
  pull_request:
    branches: [main, linux]
    paths:
      - "linux/**"
      - "!linux/docs/**"
      - "!**.md"
      - ".github/workflows/build-linux.yml"
  schedule:
    - cron: "13 14 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Commit SHA, tag or branch to build. Pin a release candidate so
          every job in the run tests the same tree.
        required: false
        default: ""

permissions:
  contents: read

# A newer pull request push supersedes its in-flight run. A run on
# linux or main is the merge-tier gate, so it is never cancelled: GitHub
# keeps the running one and the newest pending one. Scheduled and
# dispatched runs keep their own group so a release-candidate soak is
# never cancelled by ordinary branch traffic.
concurrency:
  group: build-linux-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref || 'auto' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    name: Preflight and sandbox tier (no GTK app)
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || (github.event_name == 'schedule' && 'linux') || github.sha }}
      - name: Record the commit under test
        id: revision
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libsecret-1-dev \
            libkrb5-dev \
            libsqlite3-dev \
            clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: linux
          prefix-key: linux-preflight
      - name: Preflight
        run: python3 scripts/run-test-layer.py quick

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: linux/target/quality/*-layers
          if-no-files-found: error

  fast:
    name: Fast checks (GTK)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: preflight
    # The GNOME 50 baseline requires GTK 4.22, GLib 2.88 and libadwaita 1.9.
    # Debian testing provides that native stack. The
    # integration job stays on the host runner — driver crates depend
    # only on tablepro-core, so they don't pull in libadwaita.
    container:
      image: debian:testing
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        working-directory: linux
    steps:
      - name: Install Git before checkout
        working-directory: /tmp
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            libssl-dev \
            libsecret-1-dev \
            libkrb5-dev \
            libsqlite3-dev \
            clang \
            dbus-daemon \
            xvfb \
            xauth \
            at-spi2-core \
            python3-pyatspi
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: linux
          prefix-key: linux-fast-gtk
      - name: Focused tests for changed B3 value paths
        env:
          TABLEPRO_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python3 scripts/run-test-layer.py change-contracts
      - name: Unit tests (build via test)
        run: python3 scripts/run-test-layer.py full
      - name: Isolated GTK widget regressions
        run: python3 scripts/run-test-layer.py widgets
      - name: App numeric parser against PostgreSQL
        run: python3 scripts/run-test-layer.py app-server

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            linux/target/quality/*-layers
            linux/target/quality/*-change-contracts
          if-no-files-found: error

  gtk-safety:
    if: github.event_name != 'pull_request'
    name: Installed GTK safety smoke
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: [preflight, fast]
    container:
      image: debian:testing
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        working-directory: linux
    steps:
      - name: Install Git before checkout
        working-directory: /tmp
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - name: Install GTK test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev \
            libssl-dev libsecret-1-dev libsecret-tools libkrb5-dev libsqlite3-dev clang \
            dbus-daemon gnome-keyring libglib2.0-bin xvfb xauth at-spi2-core python3-pyatspi scrot
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: linux
          prefix-key: linux-gtk-safety
      - name: Secret Service round-trip
        run: python3 scripts/run-test-layer.py keyring
      - name: GTK installed-flow smoke
        env:
          TABLEPRO_GTK_ARTIFACT_DIR: ${{ github.workspace }}/gtk-artifacts/smoke
        run: python3 scripts/run-test-layer.py ui
      - name: Upload GTK diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: gtk-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: gtk-artifacts
          if-no-files-found: error

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-gtk-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: linux/target/quality/*-layers
          if-no-files-found: error

  current-stable-clippy:
    name: Current stable Clippy (scheduled)
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: preflight
    container:
      image: debian:testing
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        working-directory: linux
    steps:
      - name: Install Git before checkout
        working-directory: /tmp
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            libssl-dev \
            libsecret-1-dev \
            libkrb5-dev \
            libsqlite3-dev \
            clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: linux
          prefix-key: linux-current-stable-clippy
      - name: Clippy on current stable
        # The repository override selects 1.98, so +stable is required here.
        run: cargo +stable clippy --workspace --exclude tablepro-driver-duckdb --all-targets -- -D warnings

  integration:
    if: github.event_name != 'pull_request'
    name: Driver integration tests (docker)
    timeout-minutes: 55
    runs-on: ubuntu-24.04
    needs: [preflight, b4-rollback]
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libkrb5-dev \
            clang \
            dbus-daemon \
            gnome-keyring \
            libsecret-tools \
            libglib2.0-bin
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: linux
          prefix-key: linux-integration
      - name: Verify docker is available
        run: docker version
      - name: Driver, socket and SSH integration
        run: python3 scripts/run-test-layer.py drivers

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: linux/target/quality/*-layers
          if-no-files-found: error

  b4-rollback:
    if: github.event_name != 'pull_request'
    name: B4 rollback acceptance (docker)
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: preflight
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libkrb5-dev \
            clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: linux
          prefix-key: linux-integration
      - name: Verify docker is available
        run: docker version
      - name: Focused MySQL and PostgreSQL rollback cases
        run: python3 scripts/run-test-layer.py b4-rollback

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-b4-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: linux/target/quality/*-layers
          if-no-files-found: error

  driver-tls:
    if: github.event_name != 'pull_request'
    name: Driver TLS fixture (docker)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: preflight
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libkrb5-dev \
            clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: linux
          prefix-key: linux-driver-tls
      - name: Verify docker is available
        run: docker compose version
      - name: Driver TLS fixture
        run: python3 scripts/run-test-layer.py tls

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-driver-tls-${{ github.run_id }}-${{ github.run_attempt }}
          path: linux/target/quality/*-layers
          if-no-files-found: error

  postgres-release:
    if: github.event_name != 'pull_request'
    name: PostgreSQL release fixture (docker)
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: preflight
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      # test-postgres-release.sh builds the GTK app and runs PostgreSQL AT-SPI scenarios.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            libsecret-1-dev \
            libkrb5-dev \
            libsqlite3-dev \
            clang \
            openssh-client \
            dbus-daemon \
            gnome-keyring \
            libsecret-tools \
            libglib2.0-bin \
            xvfb \
            xauth \
            at-spi2-core \
            python3-pyatspi
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: linux
          prefix-key: linux-postgres-release
      - name: Build staged release GTK binary
        run: cargo build --locked --release -p tablepro-app
      - name: Stage release binary for installed GTK scenarios
        run: install -Dm755 target/release/tablepro-app target/installed/usr/bin/tablepro
      - name: Verify docker is available
        run: docker compose version
      - name: PostgreSQL TLS, SSH, lock, and reconnect fixture
        env:
          TABLEPRO_GTK_BINARY: target/installed/usr/bin/tablepro
        run: python3 scripts/run-test-layer.py postgres-release

      - name: MySQL human-approval dialog regression
        env:
          TABLEPRO_GTK_BINARY: target/installed/usr/bin/tablepro
        run: bash scripts/test-gtk-mysql-approval.sh

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-postgres-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: linux/target/quality/*-layers
          if-no-files-found: error

  duckdb:
    if: github.event_name != 'pull_request'
    needs: preflight
    name: Optional DuckDB driver and GTK feature
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container:
      image: debian:testing
      env:
        DEBIAN_FRONTEND: noninteractive
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    defaults:
      run:
        working-directory: linux
    steps:
      - name: Install Git before checkout
        working-directory: /tmp
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git pkg-config clang \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libssl-dev libsecret-1-dev libkrb5-dev libsqlite3-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: linux
          prefix-key: linux-duckdb
      - name: Driver tests including offline extensions and flat files
        run: cargo test --locked -p tablepro-driver-duckdb
      - name: Build the GTK application with DuckDB
        run: cargo build --locked -p tablepro-app --features duckdb
      - name: Run app DuckDB value contracts
        run: cargo test --locked -p tablepro-app --features duckdb --lib value_contract_duckdb

  regression-gate:
    name: Linux regression gate
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - preflight
      - fast
      - gtk-safety
      - integration
      - b4-rollback
      - driver-tls
      - postgres-release
      - duckdb
      - current-stable-clippy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.commit || github.sha }}
      - name: Require every regression job
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 linux/scripts/check-ci-jobs.py
