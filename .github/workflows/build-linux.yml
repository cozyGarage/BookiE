name: Build Linux

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - ".github/workflows/build-linux.yml"
      - ".github/actions/dockerhub-login/**"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - ".github/workflows/build-linux.yml"
      - ".github/actions/dockerhub-login/**"
  schedule:
    - cron: "13 14 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Commit SHA, tag or branch to build. Pin a release candidate so
          every job in the run tests the same tree.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: read

# A newer pull request push supersedes its in-flight run. Default-branch pushes
# run the T0 checks. Pull requests, schedules and
# dispatch run the full T1 regression gate. Scheduled and dispatched runs keep
# their own concurrency group so a manual full Build Linux is never cancelled
# by ordinary branch traffic.
concurrency:
  group: build-linux-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref || 'auto' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pin-revision:
    name: Pin tested revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.pin.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Pin the tested revision once
        id: pin
        env:
          CI_REQUESTED_REF: ${{ inputs.ref }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/check-ci-revision.py

  ensure-ci-gtk-image:
    name: Ensure CI debian-testing GTK image
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: pin-revision
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull or build and push
        id: publish
        env:
          IMAGE: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk
        run: |
          set -euo pipefail
          hash="$(sha256sum ci/debian-testing-gtk/Dockerfile | cut -c1-16)"
          tag="df-${hash}"
          tag_hash="${IMAGE}:${tag}"
          tag_latest="${IMAGE}:latest"
          if ! docker pull "$tag_hash"; then
            docker build --pull \
              -t "$tag_hash" \
              -t "$tag_latest" \
              -f ci/debian-testing-gtk/Dockerfile \
              ci/debian-testing-gtk
            docker push "$tag_hash"
            docker push "$tag_latest"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  guards:
    name: Workflow and source guards
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
          components: rustfmt
      - name: Mark checkout safe for Git in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Script harness and source guards
        run: |
          cargo fetch --locked --manifest-path apps/linux/app/Cargo.toml
          bash scripts/test-harness.sh
          bash scripts/check-file-size.sh
          bash scripts/check-bounded-operations.sh
          bash scripts/check-panic-sites.sh
          python3 scripts/check-crate-boundaries.py
          python3 scripts/check-driver-id-branches.py
          python3 scripts/check-function-size.py
          python3 scripts/check-comment-lines.py
          python3 scripts/release-notes.py fragments
          cargo fmt --all -- --check

  clippy:
    name: Workspace Clippy
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: linux-clippy
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  unit:
    name: Unit tests
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, test-build]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-workspace
          path: ${{ runner.temp }}/bookie-unit-bundle
      - name: Run unit archive
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
          GSETTINGS_SCHEMA_DIR: ${{ runner.temp }}/bookie-unit-bundle/schemas
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci-test-bundle.py verify "$RUNNER_TEMP/bookie-unit-bundle" "$BOOKIE_SOURCE_COMMIT" --expected-group workspace
          NEXTEST="$(bash scripts/ensure-nextest.sh)"
          "$NEXTEST" nextest run --archive-file "$RUNNER_TEMP/bookie-unit-bundle/nextest.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE" --profile ci --no-tests=fail -E 'kind(lib) | kind(bin)'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-direct
          path: ${{ runner.temp }}/bookie-direct-bundle
      - name: Verify the direct test bundle
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
          BOOKIE_TEST_BUNDLE: ${{ runner.temp }}/bookie-direct-bundle
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci-test-bundle.py verify "$BOOKIE_TEST_BUNDLE" "$BOOKIE_SOURCE_COMMIT" --expected-group direct
          find "$BOOKIE_TEST_BUNDLE" -type f \( -path "$BOOKIE_TEST_BUNDLE/tests/*" -o -path "$BOOKIE_TEST_BUNDLE/bin/*" \) -exec chmod u+x {} +
      - name: Fetch the comparison base for changed-path tests
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BOOKIE_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BOOKIE_CHANGE_BASE"
      - name: Focused Data-lane change contracts
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BOOKIE_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          BOOKIE_TEST_BUNDLE: ${{ runner.temp }}/bookie-direct-bundle
        run: python3 scripts/run-test-layer.py change-contracts

  sandbox:
    name: Sandbox tests
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, test-build]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-workspace
          path: ${{ runner.temp }}/bookie-sandbox-bundle
      - name: Run sandbox archive
        env:
          BOOKIE_TEST_BUNDLE: ${{ runner.temp }}/bookie-sandbox-bundle
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
          BOOKIE_REQUIRE_PREBUILT: "1"
          BOOKIE_NEXTEST_PROFILE: ci
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci-test-bundle.py verify "$BOOKIE_TEST_BUNDLE" "$BOOKIE_SOURCE_COMMIT" --expected-group workspace
          python3 scripts/run-test-layer.py sandbox

  test-build:
    name: Build and publish test bundles
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image]
    timeout-minutes: 45
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      BOOKIE_BUILD_IMAGE: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: linux-test-bundles
      - name: Build versioned executable test bundles
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build-test-bundles.sh "$GITHUB_WORKSPACE/reusable-builds" github
      - name: Check the no-default-features layer
        run: python3 scripts/run-test-layer.py no-default-features
      - name: Upload source-pinned direct test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-direct
          path: reusable-builds/direct/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned consumer test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-consumers
          path: reusable-builds/consumers/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned core driver test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-driver-core
          path: reusable-builds/driver-core/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned analytics driver test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-driver-analytics
          path: reusable-builds/driver-analytics/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned extended driver test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-driver-extended
          path: reusable-builds/driver-extended/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned socket and SSH test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-socket-ssh
          path: reusable-builds/socket-ssh/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned driver TLS test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-driver-tls
          path: reusable-builds/driver-tls/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned PostgreSQL release test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-pg-release
          path: reusable-builds/pg-release/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned keyring test bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-keyring
          path: reusable-builds/keyring/
          if-no-files-found: error
          retention-days: 14
      - name: Upload source-pinned workspace archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-workspace
          path: reusable-builds/workspace/
          if-no-files-found: error
          retention-days: 14

  gpui-build:
    if: github.event_name != 'push'
    name: Build GPUI test bundle
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      BOOKIE_BUILD_IMAGE: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: linux-gpui-test-bundles
      - name: Build versioned GPUI test bundle
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build-test-bundles.sh "$GITHUB_WORKSPACE/gpui-build" gpui
      - name: Upload source-pinned GPUI bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-gpui
          path: gpui-build/gpui/
          if-no-files-found: error
          retention-days: 14

  gpui-tests:
    if: github.event_name != 'push'
    name: GPUI model and simulated interaction tests
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, gpui-build]
    timeout-minutes: 45
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/gpui-${{ github.run_id }}-${{ github.run_attempt }}
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-gpui
          path: ${{ runner.temp }}/bookie-gpui-bundle
      - name: GPUI model and simulated interaction tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci-test-bundle.py verify "$RUNNER_TEMP/bookie-gpui-bundle" "${{ needs.pin-revision.outputs.revision }}" --expected-group gpui
          workspace_root="$(cd apps/gpui && pwd -P)"
          test -r "$workspace_root/tests/fixtures/orders.sqlite"
          NEXTEST="$(bash scripts/ensure-nextest.sh)"
          mkdir -p "$RUNNER_TEMP/bookie-gpui-extract"
          "$NEXTEST" nextest run --archive-file "$RUNNER_TEMP/bookie-gpui-bundle/nextest.tar.zst" \
            --workspace-remap "$workspace_root" \
            --extract-to "$RUNNER_TEMP/bookie-gpui-extract" --profile default --no-tests=fail
      - name: Finalize runner job
        if: always()
        run: rm -rf -- "$CARGO_TARGET_DIR" "$RUNNER_TEMP/bookie-gpui-extract"

  widgets:
    name: GTK widget tests
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, test-build]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-direct
          path: ${{ runner.temp }}/bookie-direct-bundle
      - name: Run isolated GTK widget regressions
        env:
          BOOKIE_TEST_BUNDLE: ${{ runner.temp }}/bookie-direct-bundle
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
          BOOKIE_REQUIRE_PREBUILT: "1"
          GSETTINGS_SCHEMA_DIR: ${{ runner.temp }}/bookie-direct-bundle/schemas
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci-test-bundle.py verify "$BOOKIE_TEST_BUNDLE" "$BOOKIE_SOURCE_COMMIT" --expected-group direct
          find "$BOOKIE_TEST_BUNDLE" -type f \( -path "$BOOKIE_TEST_BUNDLE/tests/*" -o -path "$BOOKIE_TEST_BUNDLE/bin/*" \) -exec chmod u+x {} +
          python3 scripts/run-test-layer.py widgets
      - name: Retain GTK widget diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: widgets-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error
          retention-days: 2

  consumers:
    if: github.event_name != 'push'
    name: MCP, policy and app server tests
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, guards, clippy, test-build]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      env:
        DEBIAN_FRONTEND: noninteractive
        DOCKER_CONFIG: /github/home/.docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-consumers
          path: ${{ runner.temp }}/bookie-consumers-bundle
      - name: Verify the source-pinned test bundle
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci-test-bundle.py verify "$RUNNER_TEMP/bookie-consumers-bundle" "$BOOKIE_SOURCE_COMMIT" --expected-group consumers
          find "$RUNNER_TEMP/bookie-consumers-bundle/tests" "$RUNNER_TEMP/bookie-consumers-bundle/bin" -type f -exec chmod u+x {} +
      - name: Docker Hub login
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull app-server fixture images
