name: Build Linux

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - ".github/workflows/build-linux.yml"
      - ".github/actions/dockerhub-login/**"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - ".github/workflows/build-linux.yml"
      - ".github/actions/dockerhub-login/**"
  schedule:
    - cron: "13 14 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Commit SHA, tag or branch to build. Pin a release candidate so
          every job in the run tests the same tree.
        required: false
        default: ""

permissions:
  contents: read
  packages: read

# A newer pull request push supersedes its in-flight run. Pull requests and
# Default-branch pushes run the full required regression jobs. Current-stable
# Clippy stays schedule or dispatch only. Scheduled and dispatched runs keep
# their own concurrency group so a manual full Build Linux is never cancelled
# by ordinary branch traffic.
concurrency:
  group: build-linux-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref || 'auto' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pin-revision:
    name: Pin tested revision
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.pin.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || (github.event_name == 'schedule' && 'main') || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Pin the tested revision once
        id: pin
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          echo "tree under test: $revision"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$REQUESTED_REF" ]]; then
            case "$REQUESTED_REF" in
              refs/pull/*|pull/*)
                echo "workflow_dispatch cannot pin a pull request ref" >&2
                exit 1
                ;;
            esac
            git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
            if ! git branch -r --contains "$revision" | grep -qE 'origin/' \
              && ! git tag --contains "$revision" | grep -q .; then
              echo "pinned revision must be on an origin branch or tag" >&2
              exit 1
            fi
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  ensure-ci-gtk-image:
    name: Ensure CI debian-testing GTK image
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: pin-revision
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull or build and push
        id: publish
        env:
          IMAGE: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk
        run: |
          set -euo pipefail
          hash="$(sha256sum ci/debian-testing-gtk/Dockerfile | cut -c1-16)"
          tag="df-${hash}"
          tag_hash="${IMAGE}:${tag}"
          tag_latest="${IMAGE}:latest"
          if ! docker pull "$tag_hash"; then
            docker build --pull \
              -t "$tag_hash" \
              -t "$tag_latest" \
              -f ci/debian-testing-gtk/Dockerfile \
              ci/debian-testing-gtk
            docker push "$tag_hash"
            docker push "$tag_latest"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  preflight:
    name: Preflight and sandbox tier (no GTK app)
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: pin-revision
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libsecret-1-dev \
            libkrb5-dev \
            libsqlite3-dev \
            clang \
            gettext
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
          components: rustfmt, clippy
      - name: Fetch locked dependency manifests for notice generation
        run: |
          cargo fetch --locked --manifest-path apps/linux/app/Cargo.toml
          cargo fetch --locked --manifest-path crates/agentd/Cargo.toml
          cargo fetch --locked --manifest-path crates/ssh/Cargo.toml
      - name: Shared sccache
        if: github.event_name != 'workflow_dispatch' || inputs.ref == ''
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
      - name: Enable sccache for Rust
        if: github.event_name != 'workflow_dispatch' || inputs.ref == ''
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: linux-build
          save-if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      - name: Preflight
        run: python3 scripts/run-test-layer.py quick

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  reusable-test-builds:
    name: Reusable test builds
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image]
    timeout-minutes: 60
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      BOOKIE_BUILD_IMAGE: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - name: Build versioned executable test bundles
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build-test-bundles.sh "$GITHUB_WORKSPACE/reusable-builds"
      - name: Upload source-pinned default bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-default
          path: reusable-builds/default/
          if-no-files-found: error
          retention-days: 14

  fast:
    name: Fast checks (GTK)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image]
    # The toolkit floor (ADR 0021) requires GTK 4.24, GLib 2.88, libadwaita 1.10 and GtkSourceView 5.22.
    # Pre-baked debian:testing + GTK deps from ci/debian-testing-gtk.
    # The integration job stays on the host runner — driver crates depend
    # only on bookie-core, so they don't pull in libadwaita.
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      env:
        DEBIAN_FRONTEND: noninteractive
        DOCKER_CONFIG: /github/home/.docker
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
          pkg-config --exists 'glib-2.0 >= 2.80'
      - name: Install gettext tools for generated catalog checks
        run: |
          apt-get update
          apt-get install --no-install-recommends -y gettext
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
          components: rustfmt, clippy
      - name: Fetch locked dependency manifests for notice generation
        run: |
          cargo fetch --locked --manifest-path apps/linux/app/Cargo.toml
          cargo fetch --locked --manifest-path crates/agentd/Cargo.toml
          cargo fetch --locked --manifest-path crates/ssh/Cargo.toml
      - name: Shared sccache
        if: github.event_name != 'workflow_dispatch' || inputs.ref == ''
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
      - name: Enable sccache for Rust
        if: github.event_name != 'workflow_dispatch' || inputs.ref == ''
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: linux-build
          save-if: false
      - name: Focused tests for changed Data-lane value paths
        env:
          BOOKIE_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python3 scripts/run-test-layer.py change-contracts
      - name: GTK app unit tests (build via test)
        run: python3 scripts/run-test-layer.py gtk-app
      - name: Isolated GTK widget regressions
        run: python3 scripts/run-test-layer.py widgets
      - name: Pre-pull app-server fixture images
        run: bash scripts/prepull-test-images.sh app-server
      - name: App numeric parser against PostgreSQL
        run: python3 scripts/run-test-layer.py app-server
      - name: Build GTK safety binary
        run: |
          cargo build --locked -p bookie-app --bin bookie-app
          install -Dm755 target/debug/bookie-app target/gtk-safety/bookie
      - name: Upload GTK safety binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: gtk-safety-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/gtk-safety/bookie
          if-no-files-found: error
          retention-days: 1

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/quality/*-layers
            target/quality/*-change-contracts
          if-no-files-found: error

  gtk-safety:
    name: Installed GTK safety smoke
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, fast]
    container:
      image: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        working-directory: .
    steps:
      - name: Install Git before checkout
        working-directory: /tmp
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gtk-safety-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/gtk-safety
      - name: Ensure GTK safety binary is executable
        run: chmod 0755 target/gtk-safety/bookie
      - name: Install GTK test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends scrot
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - name: Secret Service round-trip
        run: python3 scripts/run-test-layer.py keyring
      - name: GTK installed-flow smoke
        env:
          BOOKIE_GTK_ARTIFACT_DIR: ${{ github.workspace }}/gtk-artifacts/smoke
          BOOKIE_GTK_BINARY: target/gtk-safety/bookie
        run: python3 scripts/run-test-layer.py ui
      - name: Upload GTK diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: gtk-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: gtk-artifacts
          if-no-files-found: error

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-gtk-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  current-stable-clippy:
    name: Current stable Clippy (scheduled)
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: pin-revision
    container:
      image: debian:testing
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        working-directory: .
    steps:
      - name: Install Git before checkout
        working-directory: /tmp
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            libssl-dev \
            libsecret-1-dev \
            libkrb5-dev \
            libsqlite3-dev \
            clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-current-stable-clippy
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: Clippy on current stable
        # The repository override selects 1.98, so +stable is required here.
        run: cargo +stable clippy --workspace --all-targets -- -D warnings

  integration:
    name: Driver integration tests (docker)
    timeout-minutes: 55
    runs-on: ubuntu-24.04
    needs: [pin-revision, b4-rollback, ensure-ci-gtk-image, reusable-test-builds]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-default
          path: ${{ runner.temp }}/bookie-bundle
      - name: Verify the test bundle
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$BOOKIE_SOURCE_COMMIT"
          python3 scripts/ci-test-bundle.py verify "$RUNNER_TEMP/bookie-bundle" "$BOOKIE_SOURCE_COMMIT"
          find "$RUNNER_TEMP/bookie-bundle/tests" "$RUNNER_TEMP/bookie-bundle/bin" -type f -exec chmod u+x {} +
      - name: Driver, socket and SSH integration
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
          BOOKIE_BUILD_IMAGE: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
        run: |
          task_tmp="$(mktemp -d /tmp/bookie-ci.XXXXXX)"
          trap 'rm -rf -- "$task_tmp"' EXIT
          docker run --rm --entrypoint cat "$BOOKIE_BUILD_IMAGE" /etc/passwd > "$RUNNER_TEMP/bookie-integration-passwd"
          printf 'bookie-ci:x:%s:%s:CI:%s:/usr/sbin/nologin\n' "$(id -u)" "$(id -g)" "$task_tmp" >> "$RUNNER_TEMP/bookie-integration-passwd"
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --volume "$RUNNER_TEMP/bookie-integration-passwd:/etc/passwd:ro" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --volume "$task_tmp:$task_tmp" \
            --volume "$HOME/.docker:/docker:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            --env HOME="$task_tmp" --env TMPDIR="$task_tmp" \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            --env DOCKER_CONFIG=/docker --env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --env BOOKIE_TEST_BUNDLE="$RUNNER_TEMP/bookie-bundle" \
            --env BOOKIE_REQUIRE_PREBUILT=1 --env BOOKIE_SOURCE_COMMIT="$BOOKIE_SOURCE_COMMIT" \
            "$BOOKIE_BUILD_IMAGE" python3 scripts/run-test-layer.py drivers

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  b4-rollback:
    name: Policy rollback acceptance (docker)
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: pin-revision
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libkrb5-dev \
            clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-integration
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: Verify docker is available
        run: docker version
      - name: Focused MySQL and PostgreSQL rollback cases
        run: python3 scripts/run-test-layer.py b4-rollback

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-b4-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  driver-tls:
    name: Driver TLS fixture (docker)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: pin-revision
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libkrb5-dev \
            clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-driver-tls
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: Verify docker is available
        run: docker compose version
      - name: Driver TLS fixture
        run: python3 scripts/run-test-layer.py tls

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-driver-tls-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  postgres-release:
    name: PostgreSQL release fixture (docker)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      BOOKIE_BUILD_IMAGE: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-postgres-release
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: PostgreSQL release and GTK acceptance on the supported toolkit floor
        env:
          BOOKIE_GTK_BINARY: target/installed/usr/bin/bookie
        run: |
          set -euo pipefail
          toolchain_bin="$(dirname "$(rustup which cargo --toolchain 1.98)")"
          toolchain_relative="${toolchain_bin#"$HOME/.rustup"}"
          if [[ "$toolchain_relative" == "$toolchain_bin" ]]; then
            echo "Rust toolchain is outside the mounted Rustup home" >&2
            exit 1
          fi
          docker run --rm --entrypoint cat "$BOOKIE_BUILD_IMAGE" /etc/passwd > "$RUNNER_TEMP/bookie-ci-passwd"
          printf 'bookie-ci:x:%s:%s:CI:/tmp:/usr/sbin/nologin\n' "$(id -u)" "$(id -g)" >> "$RUNNER_TEMP/bookie-ci-passwd"
          docker run --rm \
            --network host \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --volume "$RUNNER_TEMP/bookie-ci-passwd:/etc/passwd:ro" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$HOME/.cargo:/cargo" \
            --volume "$HOME/.rustup:/rustup:ro" \
            --volume "$HOME/.docker:/docker" \
            --workdir "$GITHUB_WORKSPACE" \
            --env HOME=/tmp \
            --env CARGO_HOME=/cargo \
            --env RUSTUP_HOME=/rustup \
            --env CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            --env CARGO_BUILD_JOBS=4 \
            --env PATH="/rustup${toolchain_relative}:/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            --env DOCKER_CONFIG=/docker \
            --env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --env BOOKIE_GTK_BINARY="$BOOKIE_GTK_BINARY" \
            "$BOOKIE_BUILD_IMAGE" \
            bash -euo pipefail -c '
              git config --global --add safe.directory "$GITHUB_WORKSPACE"
              echo "tree under test: $(git rev-parse HEAD)"
              cargo --version
              rustc --version
              pkg-config --modversion gtk4 glib-2.0 libadwaita-1 gtksourceview-5
              pkg-config --atleast-version=4.24 gtk4
              pkg-config --atleast-version=2.88 glib-2.0
              pkg-config --atleast-version=1.10 libadwaita-1
              pkg-config --atleast-version=5.22 gtksourceview-5
              docker compose version
              docker info --format "{{.ServerVersion}}"
              cargo build --locked --release -p bookie-app
              install -Dm755 target/release/bookie-app "$BOOKIE_GTK_BINARY"
              python3 scripts/run-test-layer.py postgres-release
              bash scripts/test-gtk-mysql-approval.sh
            '

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-postgres-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

  regression-gate:
    name: Linux regression gate
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - pin-revision
      - preflight
      - fast
      - gtk-safety
      - integration
      - b4-rollback
      - driver-tls
      - postgres-release
      - current-stable-clippy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Require every regression job
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-jobs.py
