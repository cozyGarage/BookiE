        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        working-directory: .
    steps:
      - name: Install Git before checkout
        working-directory: /tmp
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Record the commit under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            libssl-dev \
            libsecret-1-dev \
            libkrb5-dev \
            libsqlite3-dev \
            clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          prefix-key: linux-current-stable-clippy
          save-if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
      - name: Clippy on current stable
        # The repository override selects 1.98, so +stable is required here.
        run: cargo +stable clippy --workspace --all-targets -- -D warnings

  driver:
    if: github.event_name != 'push'
    name: Driver integration tests (docker) (${{ matrix.group }})
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    needs: [pin-revision, ensure-ci-gtk-image, guards, clippy, test-build]
    strategy:
      fail-fast: false
      matrix:
        group: [driver-core, driver-analytics, driver-extended, socket-ssh]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.pin-revision.outputs.revision }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookie-tests-${{ needs.pin-revision.outputs.revision }}-${{ matrix.group }}
          path: ${{ runner.temp }}/bookie-test-bundle
      - name: Verify the test bundle
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$BOOKIE_SOURCE_COMMIT"
          python3 scripts/ci-test-bundle.py verify "$RUNNER_TEMP/bookie-test-bundle" "$BOOKIE_SOURCE_COMMIT" --expected-group "${{ matrix.group }}"
          find "$RUNNER_TEMP/bookie-test-bundle/tests" "$RUNNER_TEMP/bookie-test-bundle/bin" -type f -exec chmod u+x {} +
      - name: Run integration layer in the shared image
        env:
          BOOKIE_SOURCE_COMMIT: ${{ needs.pin-revision.outputs.revision }}
          BOOKIE_BUILD_IMAGE: ghcr.io/cozygarage/bookie/ci-debian-testing-gtk:${{ needs.ensure-ci-gtk-image.outputs.tag }}
          BOOKIE_TEST_BUNDLE: ${{ runner.temp }}/bookie-test-bundle
          BOOKIE_TEST_LAYER: ${{ matrix.group }}
          BOOKIE_TEST_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}
        run: |
          task_tmp="$(mktemp -d /tmp/bookie-ci.XXXXXX)"
          trap 'rm -rf -- "$task_tmp"' EXIT
          docker run --rm --entrypoint cat "$BOOKIE_BUILD_IMAGE" /etc/passwd > "$RUNNER_TEMP/bookie-integration-passwd"
          printf 'bookie-ci:x:%s:%s:CI:%s:/usr/sbin/nologin\n' "$(id -u)" "$(id -g)" "$task_tmp" >> "$RUNNER_TEMP/bookie-integration-passwd"
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --volume "$RUNNER_TEMP/bookie-integration-passwd:/etc/passwd:ro" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --volume "$task_tmp:$task_tmp" \
            --volume "$HOME/.docker:/docker:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            --env HOME="$task_tmp" --env TMPDIR="$task_tmp" \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            --env DOCKER_CONFIG=/docker --env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            --env BOOKIE_TEST_BUNDLE="$BOOKIE_TEST_BUNDLE" \
            --env BOOKIE_TEST_LAYER="$BOOKIE_TEST_LAYER" \
            --env BOOKIE_TEST_RUN_ID="$BOOKIE_TEST_RUN_ID" \
            --env BOOKIE_REQUIRE_PREBUILT=1 --env BOOKIE_SOURCE_COMMIT="$BOOKIE_SOURCE_COMMIT" \
            "$BOOKIE_BUILD_IMAGE" bash -euo pipefail -c 'python3 scripts/run-test-layer.py "$BOOKIE_TEST_LAYER"; if [[ "$BOOKIE_TEST_LAYER" == driver-core ]]; then python3 scripts/run-test-layer.py pg-dump; fi'

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: regression-integration-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/*-layers
          if-no-files-found: error

