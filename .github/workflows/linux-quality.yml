name: Linux test quality

on:
  push:
    branches: [linux]
    paths:
      - ".github/workflows/linux-quality.yml"
      - "linux/crates/drivers/postgres/src/**"
      - "linux/crates/drivers/postgres/tests/**"
      - "linux/crates/core/**"
      - "linux/crates/policy/**"
      - "linux/crates/ssh/**"
      - "linux/crates/drivers/redis/**"
      - "linux/scripts/tests/test_mutation_workflow.py"
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag or branch to measure."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: linux-quality-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation testing (core, policy, ssh, redis, postgres)
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || 'linux' }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsecret-1-dev libkrb5-dev clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: linux
          prefix-key: linux-mutants
      - name: Install cargo-mutants
        id: mutation-tool
        run: cargo install cargo-mutants --locked --version ^27
      - name: Mutate PostgreSQL value decoders
        id: mutate-postgres
        if: ${{ !cancelled() && steps.mutation-tool.outcome == 'success' }}
        run: |
          cargo mutants --package tablepro-driver-postgres --test-tool cargo \
            --file crates/drivers/postgres/src/array.rs \
            --file crates/drivers/postgres/src/numeric.rs \
            --file crates/drivers/postgres/src/temporal.rs \
            --output mutants-driver-postgres --timeout 60 --no-shuffle \
            -- --lib --test integration value_contract -- --include-ignored --test-threads=1
      - name: Mutate tablepro-core
        id: mutate-core
        if: ${{ !cancelled() && steps.mutation-tool.outcome == 'success' }}
        run: |
          cargo mutants --package tablepro-core --test-tool cargo \
            --output mutants-core --timeout 60 --no-shuffle -- --lib
      - name: Mutate tablepro-policy
        id: mutate-policy
        if: ${{ !cancelled() && steps.mutation-tool.outcome == 'success' }}
        run: |
          cargo mutants --package tablepro-policy --test-tool cargo \
            --output mutants-policy --timeout 60 --no-shuffle -- --lib
      - name: Mutate tablepro-ssh
        id: mutate-ssh
        if: ${{ !cancelled() && steps.mutation-tool.outcome == 'success' }}
        run: |
          cargo mutants --package tablepro-ssh --test-tool cargo \
            --output mutants-ssh --timeout 60 --no-shuffle -- --lib
      - name: Mutate tablepro-driver-redis
        id: mutate-driver-redis
        if: ${{ !cancelled() && steps.mutation-tool.outcome == 'success' }}
        run: |
          cargo mutants --package tablepro-driver-redis --test-tool cargo \
            --output mutants-driver-redis --timeout 60 --no-shuffle -- --lib
      - name: Summarise surviving mutants
        if: always()
        run: |
          missing=0
          {
            echo "### Surviving mutants"
            echo
            echo "A surviving mutant is a change to the code that no test noticed."
            echo "Some are equivalent to the original and can never be caught; the"
            echo "rest are behaviour with no test behind it."
            echo "Core step outcome: ${{ steps.mutate-core.outcome }}"
            echo "Policy step outcome: ${{ steps.mutate-policy.outcome }}"
            echo "SSH step outcome: ${{ steps.mutate-ssh.outcome }}"
            echo "Redis driver step outcome: ${{ steps.mutate-driver-redis.outcome }}"
            echo "A failed measurement can mean surviving mutants, timeouts, or infrastructure failure; inspect its logs."
            echo "PostgreSQL driver step outcome: ${{ steps.mutate-postgres.outcome }}"
            for crate in core policy ssh driver-redis driver-postgres; do
              report="mutants-$crate/mutants.out"
              caught="$report/caught.txt"
              missed="$report/missed.txt"
              timeout="$report/timeout.txt"
              unviable="$report/unviable.txt"
              echo
              echo "#### tablepro-$crate"
              echo
              if [[ ! -f "$caught" || ! -f "$missed" || ! -f "$timeout" || ! -f "$unviable" ]]; then
                echo "Measurement unavailable: missing report files; inspect the step log."
                missing=1
                continue
              fi
              if [[ ! -s "$caught" && ! -s "$missed" && ! -s "$timeout" ]]; then
                echo "Measurement unavailable: no viable mutations were tested."
                missing=1
              fi
              printf 'caught: %s, missed: %s, timeout: %s, unviable: %s\n' \
                "$(wc -l <"$caught")" "$(wc -l <"$missed")" \
                "$(wc -l <"$timeout")" "$(wc -l <"$unviable")"
              if [[ -s "$missed" ]]; then
                echo
                echo '```'
                cat "$missed"
                echo '```'
              fi
            done
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$missing"
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: mutants-${{ github.run_id }}
          path: |
            linux/mutants-core
            linux/mutants-policy
            linux/mutants-ssh
            linux/mutants-driver-redis
            linux/mutants-driver-postgres
          if-no-files-found: error

  coverage:
    name: Coverage (non-GTK crates)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || 'linux' }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsecret-1-dev libkrb5-dev libsqlite3-dev clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: linux
          prefix-key: linux-coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      # The unit and sandbox tiers only. Driver, TLS, release and GTK
      # tiers need Docker, a network fixture or a display, so including
      # them would make the number depend on the runner rather than on
      # the tests.
      - name: Measure
        run: |
          cargo llvm-cov --no-report --workspace \
            --exclude tablepro-driver-duckdb --exclude tablepro-app \
            --lib --bins --tests
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage.txt
      - name: Publish the summary
        if: always()
        run: |
          {
            echo "### Coverage, unit and sandbox tiers"
            echo
            echo "Excludes the GTK app crate, and the driver, TLS, release and"
            echo "installed-GTK tiers, which need Docker or a display."
            echo
            echo '```'
            cat coverage.txt || echo "no report produced"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: coverage-${{ github.run_id }}
          path: linux/lcov.info
          if-no-files-found: error
