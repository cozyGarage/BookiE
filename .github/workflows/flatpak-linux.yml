name: Flatpak Linux (packaging only)

on:
  push:
    branches: [main, linux]
    paths:
      - "linux/**"
      - "!linux/docs/**"
      - "!**.md"
      - ".github/workflows/flatpak-linux.yml"
  pull_request:
    branches: [main, linux]
    paths:
      - "linux/**"
      - "!linux/docs/**"
      - "!**.md"
      - ".github/workflows/flatpak-linux.yml"
  workflow_dispatch:

jobs:
  flatpak:
    name: flatpak-builder (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - profile: default
            bundle: bookie.flatpak
            manifest: linux/flatpak/com.tablepro.linux.json
          - profile: development
            bundle: bookie-devel.flatpak
            manifest: linux/flatpak/com.tablepro.linux.Devel.json
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb
        with:
          bundle: ${{ matrix.bundle }}
          manifest-path: ${{ matrix.manifest }}
          cache-key: flatpak-builder-${{ matrix.profile }}-${{ github.sha }}
          upload-artifact: true
      - name: Record packaging scope
        run: |
          echo "This workflow builds Flatpak packages. It does not run the regression or mutation suites." >> "$GITHUB_STEP_SUMMARY"
          echo "Check Build Linux and Linux test quality for the same commit: $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
