name: Flatpak Linux

on:
  push:
    branches: [main, linux]
    paths:
      - "linux/**"
      - ".github/workflows/flatpak-linux.yml"
  pull_request:
    branches: [main, linux]
    paths:
      - "linux/**"
      - ".github/workflows/flatpak-linux.yml"
  workflow_dispatch:

jobs:
  flatpak:
    name: flatpak-builder (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - profile: default
            bundle: bookie.flatpak
            manifest: linux/flatpak/com.tablepro.linux.json
          - profile: development
            bundle: bookie-devel.flatpak
            manifest: linux/flatpak/com.tablepro.linux.Devel.json
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'schedule' && 'linux' || github.ref }}
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb
        with:
          bundle: ${{ matrix.bundle }}
          manifest-path: ${{ matrix.manifest }}
          cache-key: flatpak-builder-${{ matrix.profile }}-${{ github.sha }}
          upload-artifact: true
