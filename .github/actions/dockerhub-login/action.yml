name: Docker Hub login
description: Configure Docker Hub pull credentials when repository secrets are present
inputs:
  username:
    description: Docker Hub username (empty skips login for forks without secrets)
    required: true
  password:
    description: Docker Hub access token or password
    required: true
runs:
  using: composite
  steps:
    - name: Log in to Docker Hub
      if: inputs.username != ''
      shell: bash
      env:
        DOCKERHUB_USERNAME: ${{ inputs.username }}
        DOCKERHUB_TOKEN: ${{ inputs.password }}
      run: |
        set -euo pipefail
        if [ -z "${DOCKERHUB_TOKEN}" ]; then
          echo "DOCKERHUB_USERNAME is set but DOCKERHUB_TOKEN is empty" >&2
          exit 1
        fi
        config_dir="${DOCKER_CONFIG:-${HOME}/.docker}"
        mkdir -p "${config_dir}"
        auth="$(printf '%s:%s' "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}" | base64 | tr -d '\n')"
        umask 077
        printf '%s\n' "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"${auth}\"}}}" >"${config_dir}/config.json"
        echo "Docker Hub credentials configured for authenticated pulls"
